                                ctx.clearRect(0, 0, texWidth, texHeight);
                                ctx.drawImage(img, 0, 0, texWidth, texHeight);
                                updateTexture();
                                document.getElementById('status-msg').innerText = '图片导入成功，可用橡皮擦删除';
                                // 自动保存
                                if (currentUser) saveCurrentSession();
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    };
                    input.click();
                };
            }
            const btnExportImage = document.getElementById('btn-export-image');
            if (btnExportImage) {
                btnExportImage.onclick = () => {
                    if (!window.drawingCanvas) {
                        document.getElementById('status-msg').innerText = '画布未就绪';
                        return;
                    }

                    // 将 canvas 转换为 PNG 并下载
                    const canvas = window.drawingCanvas;
                    const link = document.createElement('a');
                    link.download = `map_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    document.getElementById('status-msg').innerText = '已导出为 PNG 图片';
                };
            }
            // 存档名称管理
            const saveNameInput = document.getElementById('save-name');
            if (saveNameInput) {
                // 加载保存的存档名称
                if (currentUser) {
                    const savedName = localStorage.getItem(`saveName_${currentUser.accountId}`);
                    if (savedName) {
                        saveNameInput.value = savedName;
                    }
                }

                // 监听名称变化并保存
                saveNameInput.onchange = () => {
                    let name = saveNameInput.value.trim();
                    if (name === '') {
                        name = '新的世界存档';
                        saveNameInput.value = name;
                    }
                    if (currentUser) {
                        localStorage.setItem(`saveName_${currentUser.accountId}`, name);
                    }
                    document.getElementById('status-msg').innerText = `存档名称已更改为: ${name}`;
                };
            }
            const btnTogglePanel = document.getElementById('btn-toggle-panel');
            if (btnTogglePanel) {
                let panelCollapsed = false;
                btnTogglePanel.onclick = () => {
                    const toolBar = document.getElementById('tool-bar');
                    const userStatusBar = document.getElementById('user-status-bar');

                    if (panelCollapsed) {
                        // 展开
                        toolBar.style.display = 'block';
                        userStatusBar.style.display = 'flex';
                        btnTogglePanel.textContent = '收起面板';
                        btnTogglePanel.style.background = '#5a6e8a';
                        panelCollapsed = false;
                    } else {
                        // 收起
                        toolBar.style.display = 'none';
                        userStatusBar.style.display = 'none';
                        btnTogglePanel.textContent = '展开面板';
                        btnTogglePanel.style.background = '#3a5a6a';
                        panelCollapsed = true;
                    }
                };
            }

            colorPicker.oninput = (e) => {
                currentColor = e.target.value;
                document.getElementById('status-msg').innerText = `颜色已改变: ${currentColor}`;
            };
            const brushSizeSlider = document.getElementById('brush-size');
            const brushSizeValue = document.getElementById('brush-size-value');

            if (brushSizeSlider) {
                brushSizeSlider.oninput = (e) => {
                    brushSize = parseInt(e.target.value);
                    brushSizeValue.innerText = brushSize + 'px';
                    document.getElementById('status-msg').innerText = `画笔粗细已改为: ${brushSize}px`;
                };
            }

            // 地球鼠标事件（支持鼠标+触摸）
            let isDrawing = false, lastPos = null;

            function getPointerPos(e) {
                if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            }

            function onPointerStart(e) {
                if (!currentUser || mouseMode) return;
                if (editMarkerMode) {
                    e.preventDefault();
                    const pos = getPointerPos(e);
                    const res = getLatLonFromMouse({ clientX: pos.x, clientY: pos.y });
                    if (!res) return;
                    const near = findNearestMarker(res.lat, res.lon, 3); // 阈值 3°
                    if (!near) {
                        document.getElementById('status-msg').innerText = '附近没有标注，请靠近标注文字点击';
                        return;
                    }
                    selectedMarkerIndex = near.index;
                    showMarkerEditMenu(near, pos.x, pos.y);
                    return;
                }
                if (selectMode) {
                    e.preventDefault();
                    const { x, y } = getPointerPos(e);
                    const result = getLatLonFromMouse({ clientX: x, clientY: y });
                    if (!result) return;
                    const p = latLonToCanvas(result.lat, -result.lon);
                    if (selectionShape === 'polygon') {
                        // 单击添加顶点；靠近首点则闭合入蒙版
                        if (polygonPoints.length >= 3 && canvasDistance(p, polygonPoints[0]) <= CLOSE_THRESHOLD) {
                            ensureSelectionMask();
                            const mctx = selectionMaskCanvas.getContext('2d');
                            mctx.save();
                            mctx.fillStyle = 'rgba(255,255,255,1)';
                            mctx.beginPath();
                            mctx.moveTo(polygonPoints[0].x, polygonPoints[0].y);
                            for (let i = 1; i < polygonPoints.length; i++) mctx.lineTo(polygonPoints[i].x, polygonPoints[i].y);
                            mctx.closePath(); mctx.fill(); mctx.restore();

                            polygonPoints = [];
                            selectionPreviewActive = false;
                            currentMouseCanvasPos = null;
                            updateTexture();
                            document.getElementById('status-msg').innerText = '多边形选区已加入，可继续叠加或右键操作';
                        } else {
                            polygonPoints.push({ x: p.x, y: p.y });
                            selectionPreviewActive = true;
                            currentMouseCanvasPos = { x: p.x, y: p.y };
                            updateTexture();
                            document.getElementById('status-msg').innerText = polygonPoints.length >= 3 ? '点击首点或双击闭合多边形' : '继续单击添加顶点';
                        }
                        return;
                    }
                    if (selectionShape === 'lasso') {
                        isLassoDrawing = true;
                        lassoPoints = [{ x: p.x, y: p.y }];
                        selectionPreviewActive = true;
                        currentMouseCanvasPos = { x: p.x, y: p.y };
                        updateTexture();
                        return;
                    }
                    // 矩形/圆形：按下开始拖拽
                    isSelecting = true;
                    selectStart = { x: p.x, y: p.y };
                    selectEnd = { x: p.x, y: p.y };
                    selectionPreviewActive = true;
                    drawSelectionRect();
                    return;
                }
                e.preventDefault();
                const { x, y } = getPointerPos(e);
                const result = getLatLonFromMouse({ clientX: x, clientY: y });
                if (!result) return;
                const { lat, lon } = result;

                if (drawingEnabled) {
                    saveToUndoStack();
                    isDrawing = true;
                    drawOnCanvas(lat, lon, currentColor, brushSize, false);
                    lastPos = { lat, lon };
                } else if (fillEnabled) {
                    saveToUndoStack();
                    floodFill(lat, lon, currentColor);
                    document.getElementById('status-msg').innerText = '填色完成';
                } else if (eraserEnabled) {
                    saveToUndoStack();
                    isDrawing = true;
                    drawOnCanvas(lat, lon, '#000000', brushSize, true);
                    lastPos = { lat, lon };
                } else if (selectMode && isSelecting) {
                    const { x, y } = getPointerPos(e);
                    const result = getLatLonFromMouse({ clientX: x, clientY: y });
                    if (result) {
                        selectEnd = latLonToCanvas(result.lat, -result.lon);
                        drawSelectionRect();
                    }
                } else if (clickToAddMarkerMode) {
                    const defaultName = `地点`;
                    const customName = prompt('请输入标注名称:', defaultName);
                    let finalName;
                    if (customName === null) {
                        document.getElementById('status-msg').innerText = '已取消添加标注';
                        return;
                    } else if (customName.trim() === '') {
                        finalName = defaultName;
                    } else {
                        finalName = customName;
                    }
                    selectedMarkerPoint = { lat, lon, name: finalName };
                    addMarker(lat, lon, finalName);
                    document.getElementById('status-msg').innerText = `已添加标注: ${finalName} (${lat.toFixed(2)}, ${lon.toFixed(2)}) - 可点击"文本框"在此处添加文本`;
                } else if (isAddTextMode) {
                    if (selectedMarkerPoint && Math.abs(lat - selectedMarkerPoint.lat) < 0.5 && Math.abs(lon - selectedMarkerPoint.lon) < 0.5) {
                        const customText = prompt('请输入文本框内容:');
                        if (customText !== null && customText.trim() !== '') {
                            addTextMarker(selectedMarkerPoint.lat, selectedMarkerPoint.lon, customText);
                            document.getElementById('status-msg').innerText = `已添加文本框: ${customText}`;
                        } else if (customText === '') {
                            document.getElementById('status-msg').innerText = '已取消添加文本框（文本为空）';
                        } else {
                            document.getElementById('status-msg').innerText = '已取消添加文本框';
                        }
                    } else {
                        document.getElementById('status-msg').innerText = `请点击已选点的位置 (${selectedMarkerPoint.lat.toFixed(2)}, ${selectedMarkerPoint.lon.toFixed(2)}) 添加文本框`;
                    }
                }
            }

            function onPointerMove(e) {
                if (selectMode) {
                    e.preventDefault();
                    const { x, y } = getPointerPos(e);
                    const result = getLatLonFromMouse({ clientX: x, clientY: y });
                    if (!result) return;
                    const p = latLonToCanvas(result.lat, -result.lon);
                    currentMouseCanvasPos = { x: p.x, y: p.y };

                    if (selectionShape === 'lasso' && isLassoDrawing) {
                        const last = lassoPoints[lassoPoints.length - 1];
                        if (!last || canvasDistance(last, p) >= 2) {
                            lassoPoints.push({ x: p.x, y: p.y });
                        }
                        selectionPreviewActive = true;
                        updateTexture();
                        return;
                    }

                    if (selectionShape === 'polygon' && polygonPoints.length > 0) {
                        selectionPreviewActive = true;
                        updateTexture();
                        return;
                    }

                    if (isSelecting && (selectionShape === 'rectangle' || selectionShape === 'circle')) {
                        selectEnd = { x: p.x, y: p.y };
                        drawSelectionRect();
                    }
                    return;

                }

                if (!isDrawing) return;
                if (drawingEnabled || eraserEnabled) {
                    e.preventDefault();
                    const { x, y } = getPointerPos(e);
                    const result = getLatLonFromMouse({ clientX: x, clientY: y });
                    if (result && lastPos) {
                        const { lat, lon } = result;
                        const steps = 5;
                        for (let i = 1; i <= steps; i++) {
                            const t = i / steps;
                            const interpLat = lastPos.lat + (lat - lastPos.lat) * t;
                            const interpLon = lastPos.lon + (lon - lastPos.lon) * t;
                            drawOnCanvas(interpLat, interpLon, eraserEnabled ? '#000' : currentColor, brushSize, eraserEnabled);
                        }
                        lastPos = { lat, lon };
                    }
                }
            }

            function onPointerEnd() {
                isDrawing = false;
                lastPos = null;
                saveCurrentSession();

                // 矩形/圆形完成
                if (isSelecting) {
                    isSelecting = false;
                    if (selectedRegion) {
                        ensureSelectionMask();
                        const mctx = selectionMaskCanvas.getContext('2d');
                        mctx.save();
                        mctx.fillStyle = 'rgba(255,255,255,1)';
                        if (selectedRegion.type === 'circle') {
                            mctx.beginPath();
                            mctx.arc(selectedRegion.centerX, selectedRegion.centerY, selectedRegion.radius, 0, Math.PI * 2);
                            mctx.fill();
                        } else {
                            const minX = Math.max(0, Math.floor(selectedRegion.minX));
                            const minY = Math.max(0, Math.floor(selectedRegion.minY));
                            const maxX = Math.min(texWidth, Math.ceil(selectedRegion.maxX));
                            const maxY = Math.min(texHeight, Math.ceil(selectedRegion.maxY));
                            mctx.fillRect(minX, minY, maxX - minX, maxY - minY);
                        }
                        mctx.restore();
                    }
                    selectionPreviewActive = false;
                    selectStart = null; selectEnd = null;
                    updateTexture();
                    document.getElementById('status-msg').innerText = '选区已加入，继续拖拽可叠加；右键可操作';
                }

                // 套索完成（松手闭合）
                if (selectMode && selectionShape === 'lasso' && isLassoDrawing) {
                    isLassoDrawing = false;
                    if (lassoPoints.length >= 3) {
                        ensureSelectionMask();
                        const mctx = selectionMaskCanvas.getContext('2d');
                        mctx.save();
                        mctx.fillStyle = 'rgba(255,255,255,1)';
                        mctx.beginPath();
                        mctx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
                        for (let i = 1; i < lassoPoints.length; i++) mctx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
                        mctx.closePath(); mctx.fill(); mctx.restore();
                        document.getElementById('status-msg').innerText = '套索选区已加入，可继续叠加或右键操作';
                    }
                    lassoPoints = [];
                    selectionPreviewActive = false;
                    currentMouseCanvasPos = null;
                    updateTexture();
                }
            }

            // 鼠标事件
            renderer.domElement.addEventListener('mousedown', onPointerStart);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerEnd);

            // 触摸事件（手机端）
            renderer.domElement.addEventListener('touchstart', onPointerStart, { passive: false });
            window.addEventListener('touchmove', onPointerMove, { passive: false });
            window.addEventListener('touchend', onPointerEnd);

            //在事件绑定区域新增双击闭合（PC端）
            renderer.domElement.addEventListener('dblclick', (e) => {
                if (!selectMode || selectionShape !== 'polygon' || polygonPoints.length < 3) return;
                ensureSelectionMask();
                const mctx = selectionMaskCanvas.getContext('2d');
                mctx.save();
                mctx.fillStyle = 'rgba(255,255,255,1)';
                mctx.beginPath();
                mctx.moveTo(polygonPoints[0].x, polygonPoints[0].y);
                for (let i = 1; i < polygonPoints.length; i++) mctx.lineTo(polygonPoints[i].x, polygonPoints[i].y);
                mctx.closePath(); mctx.fill(); mctx.restore();
                polygonPoints = [];
                selectionPreviewActive = false;
                currentMouseCanvasPos = null;
                updateTexture();
                document.getElementById('status-msg').innerText = '多边形选区已加入，可继续叠加或右键操作';
            }, false);

            renderer.domElement.addEventListener('contextmenu', (e) => {
                e.preventDefault();

                const hasSelection =
                    !!getMaskBounds() ||
                    selectionPreviewActive ||
                    (selectionShape === 'polygon' && polygonPoints.length > 0) ||
                    (selectionShape === 'lasso' && isLassoDrawing && lassoPoints.length > 0);
                const canPaste = !!window.clipboard;

                if (!hasSelection && !canPaste) return;

                const menu = document.createElement('div');
                menu.style.cssText = `position: fixed; left: ${e.clientX}px; top: ${e.clientY}px; background: #1e2a32; border: 1px solid #ffaa66; border-radius: 8px; padding: 5px; z-index: 1000;`;

                const items = [];

                if (hasSelection && selectMode) {
                    items.push({ text: '复制', action: copySelection });
                    items.push({ text: '剪切', action: cutSelection });
                    items.push({ text: '清除', action: clearSelectionContent });
                    items.push({ text: '填充', action: fillSelection });
                    items.push({ text: '清除选区', action: clearSelection });
                }

                if (canPaste) {
                    items.push({
                        text: '粘贴',
                        action: () => {
                            // 以当前右键位置作为粘贴中心
                            const res = getLatLonFromMouse({ clientX: e.clientX, clientY: e.clientY });
                            if (!res) return;
                            const pos = latLonToCanvas(res.lat, -res.lon);
                            const clip = window.clipboard;
                            const w = clip.width, h = clip.height;

                            // 居中放置，并做边界夹紧
                            let x = Math.round(pos.x - w / 2);
                            let y = Math.round(pos.y - h / 2);
                            x = Math.max(0, Math.min(texWidth - w, x));
                            y = Math.max(0, Math.min(texHeight - h, y));

                            saveToUndoStack();
                            ctx.drawImage(clip, x, y);
                            updateTexture();
                            saveCurrentSession();
                            document.getElementById('status-msg').innerText = '粘贴完成';
                        }
                    });
                }

                items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.textContent = item.text;
                    btn.style.cssText = 'display: block; width: 100%; background: transparent; color: #ffdd99; border: none; padding: 8px 20px; cursor: pointer; text-align: left;';
                    btn.onmouseenter = () => btn.style.background = '#2d3e4b';
                    btn.onmouseleave = () => btn.style.background = 'transparent';
                    btn.onclick = () => {
                        item.action();
                        menu.remove();
                    };
                    menu.appendChild(btn);
                });

                document.body.appendChild(menu);
                document.addEventListener('click', () => menu.remove(), { once: true });

            });
            // 存档管理按钮
            document.getElementById('btn-save-archive')?.addEventListener('click', saveAsNewArchive);
            document.getElementById('btn-copy-archive')?.addEventListener('click', async () => {
                if (!currentArchiveId) {
                    await saveAsNewArchive();
                } else {
                    const newArchive = await duplicateArchive(currentArchiveId);
                    alert(`已复制到你的账号\n存档ID: ${newArchive.archiveId}`);
                    currentArchiveId = newArchive.archiveId;
                    accountOwner = currentUser;
                    await loadArchiveDropdown(currentUser.accountId);
                    window.history.replaceState(null, '', `map.html?accountId=${currentUser.accountId}&archiveId=${newArchive.archiveId}`);
                }
            });
            document.getElementById('btn-delete-archive')?.addEventListener('click', async () => {
                if (!currentArchiveId) {
                    alert('没有可删除的存档');
                    return;
                }
                if (currentUser.accountId !== accountOwner.accountId) {
                    alert('你没有权限删除此存档（只有存档主人可以删除）');
                    return;
                }
                if (confirm('确定删除当前存档吗？')) {
                    await deleteArchive(currentArchiveId);
                    alert('存档已删除');
                    window.location.href = `home.html?accountId=${currentUser.accountId}`;
                }
            });
            document.getElementById('change-archive-icon')?.addEventListener('click', changeArchiveIcon);
            document.getElementById('back-to-home')?.addEventListener('click', () => {
                window.location.href = `home.html?accountId=${currentUser.accountId}&username=${encodeURIComponent(accountOwner.username)}`;
            });

            // 修改退出按钮逻辑
            document.getElementById('logout-btn').onclick = async () => {
                await saveCurrentSession();
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            };

            // 更换用户头像
            document.getElementById('user-avatar')?.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const avatarUrl = event.target.result;
                        document.getElementById('user-avatar').src = avatarUrl;
                        localStorage.setItem(`userAvatar_${currentUser.accountId}`, avatarUrl);
                        document.getElementById('status-msg').innerText = '头像已更换';
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            });


            // ========== 太阳/晨昏线控制 ==========
            // 添加控制面板HTML（如果不存在则创建）
            let sunControlPanel = document.getElementById('sun-control-panel');
            if (!sunControlPanel) {
                const toolBar = document.getElementById('tool-bar');
                const newPanel = document.createElement('div');
                newPanel.id = 'sun-control-panel';
                newPanel.className = 'tool-section';
                newPanel.style.marginTop = '10px';
                newPanel.innerHTML = `
                    <div style="font-weight:bold; margin-bottom:6px;">太阳/晨昏线</div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:11px;">纬度:</span>
                        <input type="range" id="sun-lat" min="-23.26" max="23.26" step="0.01" value="23.26" style="flex:1;">
                        <span id="sun-lat-val" style="width:35px;">23.26°</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
                        <span style="font-size:11px;">经度:</span>
                        <input type="range" id="sun-lon" min="-180" max="180" step="0.01" value="0" style="flex:1;">
                        <span id="sun-lon-val" style="width:35px;">0.00°</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
                        <span style="font-size:11px;">强度:</span>
                        <input type="range" id="sun-intensity" min="0" max="2" step="0.01" value="1.2" style="flex:1;">
                        <span id="sun-intensity-val" style="width:35px;">1.20</span>
                    </div>
                        <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
                        <button id="sun-toggle" style="margin-top:6px; background:#2d3e4b; border:1px solid #7f9cbb; color:#ffdd99; border-radius:8px; padding:6px 10px; width:100%;">隐藏太阳/晨昏线</button>
                    </div>
                `;
                toolBar.appendChild(newPanel);
                // 重置画布按钮
                document.getElementById('btn-reset').onclick = async () => {
                    await resetDrawingCanvas();
                    if (currentUser) {
                        await saveCurrentSession();
                    }
                };
            }
            function applySunIntensity() {
                // 从滑块读最新值
                const input = document.getElementById('sun-intensity');
                if (input) sunIntensity = parseFloat(input.value);

                if (sunEnabled) {
                    // 太阳显示时：强度作用于太阳光（可按需带一点背光）
                    if (window.sunLight) window.sunLight.intensity = sunIntensity;
                    if (window.backFillLight) window.backFillLight.intensity = sunIntensity * 0.3; // 可调权重
                    if (window.ambientLight) window.ambientLight.intensity = 1.0; // 基础环境光
                } else {
                    // 太阳隐藏时：强度作用于环境光，确保地球亮度均匀
                    if (window.ambientLight) window.ambientLight.intensity = Math.max(0, sunIntensity);
                }
            }
            function setSunEnabled(enabled) {
                sunEnabled = enabled;

                if (window.sunLight) window.sunLight.visible = enabled;
                if (window.sunSphere) window.sunSphere.visible = enabled;
                if (window.sunGlow) window.sunGlow.visible = enabled;
                if (window.backFillLight) window.backFillLight.visible = enabled;

                // 仅切换颜色，不直接改强度；强度交给 applySunIntensity
                if (window.ambientLight) {
                    if (enabled) {
                        window.ambientLight.color.set(0x333344);
                    } else {
                        window.ambientLight.color.set(0xffffff);
                    }
                }
                // 应用当前滑块强度到对应光源
                applySunIntensity();

                const btn = document.getElementById('sun-toggle');
                if (btn) btn.textContent = enabled ? '隐藏太阳/晨昏线' : '显示太阳/晨昏线';

                const msg = document.getElementById('status-msg');
                if (msg) msg.innerText = enabled ? '太阳/晨昏线已显示' : '已关闭太阳/晨昏线，地球亮度一致（强度滑块继续生效）';

            }
            function bindNumberClickEditors() {
                const pairs = [
                    // 画笔粗细
                    { labelId: 'brush-size-value', sliderId: 'brush-size', suffix: 'px' },
                    // 太阳/晨昏线
                    { labelId: 'sun-lat-val', sliderId: 'sun-lat', suffix: '°' },
                    { labelId: 'sun-lon-val', sliderId: 'sun-lon', suffix: '°' },
                    { labelId: 'sun-intensity-val', sliderId: 'sun-intensity', suffix: '' }
                ];
                pairs.forEach(p => {
                    const label = document.getElementById(p.labelId);
                    const slider = document.getElementById(p.sliderId);
                    if (!label || !slider) return;

                    label.style.cursor = 'pointer';
                    label.title = '点击输入数值';

                    label.onclick = () => {
                        // 从标签取当前数值（去掉单位），如果失败就用滑块值
                        const text = (label.textContent || '').trim();
                        const cur = parseFloat(text.replace(/$^\d.\-$/g, ''));
                        const defVal = Number.isFinite(cur) ? cur : parseFloat(slider.value);

                        const unitTip = p.suffix ? `（单位${p.suffix}）` : '';
                        const input = prompt('输入数值' + unitTip, defVal);
                        if (input === null) return;

                        let v = parseFloat(input);
                        if (!Number.isFinite(v)) {
                            alert('请输入有效数字');
                            return;
                        }

                        // 约束到滑块范围
                        const hasMin = slider.min !== '' && slider.min != null;
                        const hasMax = slider.max !== '' && slider.max != null;
                        const step = (slider.step && slider.step !== 'any') ? parseFloat(slider.step) : null;

                        if (hasMin) v = Math.max(parseFloat(slider.min), v);
                        if (hasMax) v = Math.min(parseFloat(slider.max), v);

                        // 按 step 量化（如果有）
                        if (step && Number.isFinite(step) && step > 0) {
                            v = Math.round(v / step) * step;
                            const digits = (String(step).split('.')[1] || '').length;
                            if (digits) v = parseFloat(v.toFixed(digits));
                        }

                        // 回写滑块，触发 input，让现有逻辑更新一切
                        slider.value = v;
                        slider.dispatchEvent(new Event('input', { bubbles: true }));

                        // 立即更新标签显示（防止等待其它逻辑更新）
                        const digits = step ? (String(step).split('.')[1] || '').length : 0;
                        label.textContent = (digits ? v.toFixed(digits) : String(v)) + p.suffix;
                    };
                });
            }
            // 经纬度转三维坐标
            function updateSunPosition() {
                const lat = parseFloat(document.getElementById('sun-lat').value);
                const lon = parseFloat(document.getElementById('sun-lon').value);
                const intensity = parseFloat(document.getElementById('sun-intensity').value);
                // 更新显示值
                document.getElementById('sun-lat-val').innerText = lat.toFixed(2) + '°';
                document.getElementById('sun-lon-val').innerText = lon.toFixed(2) + '°';
                document.getElementById('sun-intensity-val').innerText = intensity;
                // 将经纬度转换为三维坐标（半径15，让太阳在地球外面）
                const radius = 15;
                const phi = (90 - lat) * Math.PI / 180;
                const theta = lon * Math.PI / 180;
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.cos(phi);
                const z = radius * Math.sin(phi) * Math.sin(theta);
                // 更新光源位置
                if (window.sunLight) {
                    window.sunLight.position.set(x, y, z);
                    window.sunLight.intensity = intensity;
                }
                // 更新太阳球体位置
                if (window.sunSphere) {
                    window.sunSphere.position.set(x, y, z);
                }
                // 更新光晕位置
                if (window.sunGlow) {
                    window.sunGlow.position.set(x, y, z);
                    window.sunGlow.intensity = intensity * 0.4;
                }
                // 调整背光补充光（纬度越高，背阴面越暗）
                const absLat = Math.abs(lat);
                const backIntensity = 0.2 + (1 - Math.min(intensity, 1.2)) * 0.3 + (90 - absLat) / 300;
                if (window.backFillLight) {
                    window.backFillLight.intensity = Math.min(0.5, backIntensity);
                }
                document.getElementById('status-msg').innerText = `太阳位置: 纬度=${lat}°, 经度=${lon}° | 强度=${intensity}`;
            }

            // 绑定事件
            const sunLatSlider = document.getElementById('sun-lat');
            const sunLonSlider = document.getElementById('sun-lon');
            const sunIntensitySlider = document.getElementById('sun-intensity');
            const sunToggleBtn = document.getElementById('sun-toggle');
            const sunIntensityInput = document.getElementById('sun-intensity');
            const sunIntensityVal = document.getElementById('sun-intensity-val');
            if (sunIntensityInput) {
                sunIntensityInput.addEventListener('input', (e) => {
                    sunIntensity = parseFloat(e.target.value);
                    if (sunIntensityVal) sunIntensityVal.textContent = e.target.value;
                    applySunIntensity();
                });
            }
            if (sunToggleBtn) {
                sunToggleBtn.onclick = () => setSunEnabled(!sunEnabled);
            }
            if (sunLatSlider) sunLatSlider.oninput = updateSunPosition;
            if (sunLonSlider) sunLonSlider.oninput = updateSunPosition;
            if (sunIntensitySlider) sunIntensitySlider.oninput = updateSunPosition;

            // 修改密码按钮
            document.getElementById('change-pwd-btn')?.addEventListener('click', () => {
                window.location.href = `index.html?accountId=${currentUser.accountId}&username=${encodeURIComponent(currentUser.username)}`;
            });

            // 注销账号按钮
            document.getElementById('delete-account-btn')?.addEventListener('click', async () => {
                if (confirm('确定要永久注销账号吗？所有数据将丢失！')) {
                    const password = prompt('请输入密码确认：');
                    if (password) {
                        try {
                            await deleteAccount(currentUser.accountId, password);
                            alert('账号已注销');
                            window.location.href = 'index.html';
                        } catch (e) {
                            alert(e.message);
                        }
                    }
                }
            });
            // 初始化太阳位置
            updateSunPosition();
            bindNumberClickEditors();
            // 离开页面时自动登出
            window.addEventListener('beforeunload', () => {
                if (currentUser) {
                    localStorage.removeItem('currentUser');
                }
            });

            // 页面隐藏时也自动登出（切换标签页等）
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && currentUser) {
                    localStorage.removeItem('currentUser');
                }
            });
        }

        startup();
    </script>
</body>
