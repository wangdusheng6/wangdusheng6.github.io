<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万综·汉语辞典</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="book" id="book">
        <div id="pagesContainer"></div>
    </div>
    <div class="sidebar-toggle">
        <button id="btnSidebar">☰ 工具</button>
    </div>
    <div class="sidebar" id="sidebar">
        <header>
            <span>工具面板</span>
            <button id="btnCloseSidebar" title="关闭">✕</button>
        </header>
        <div class="section">
            <h3>1. 跳转到页码/字母</h3>
            <div class="row">
                <input type="text" id="jumpInput" placeholder="例如：12、I、A、AA" />
                <button class="action" id="btnJump">跳转</button>
            </div>
            <small class="muted">提示：I 会弹框区分“前置 I（字母）/ 后置 I（罗马）”</small>
        </div>
        <div class="section">
            <h3>2. 搜索词条（单词/释义）</h3>
            <div class="row">
                <input type="text" id="searchInput" placeholder="输入关键词..." />
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
        <div class="section">
            <h3>3. 下载 PDF</h3>
            <div class="download-options">
                <label><input type="radio" name="dlScope" value="all" checked /> 全选</label>
                <label><input type="radio" name="dlScope" value="body" /> 仅下载正文</label>
                <label><input type="radio" name="dlScope" value="custom" /> 自定义页</label>
                <div class="custom-spec" id="customSpecBox">
                    <input type="text" id="customSpec" placeholder="例: 1-5, 7, A-D, AA-AC, I-IV" />
                    <small class="muted">数字=正文；字母=前置页/图片；罗马=后记/附录</small>
                </div>
            </div>
            <div class="row" style="margin-top:8px;">
                <button class="action" id="btnPrintExport" style="background:#5a4d3b; width: 100%;">下载为PDF</button>
            </div>
            <div class="progress-container" id="progressContainer" style="display: none; margin-top: 8px;">
                <progress id="pdfProgress" value="0" max="100"></progress>
                <small class="muted" id="dlStatus"
                    style="display: block; text-align: center; margin-top: 4px;">准备中...</small>
            </div>
        </div>
    </div>
    <!-- I 歧义弹窗 -->
    <div class="modal-mask" id="modalMask">
        <div class="modal" id="modalI">
            <h4>请选择要跳转的 I</h4>
            <div class="choice">
                <button id="btnIFront">前置 I（正文之前的字母 I）</button>
                <button id="btnIBack">后置 I（正文之后的罗马 I）</button>
            </div>
            <div class="modal-actions">
                <button id="btnModalCancel">取消</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 配置
        // ============================================================
        const DATA_URL = 'wanlon_data.jsonl';

        // ============================================================
        // 全局变量
        // ============================================================
        let allEntries = [];
        // ---- 新增全局变量与工具 ----
        let entryIdToPageIndex = new Map();   // entry._id -> pages索引
        let firstBodyPageIndex = -1;          // 第一个正文页在 pages 中的索引
        let labelsToIndices = new Map();      // 标签(字符串大写) -> [索引数组]
        let _IModalFront = [], _IModalBack = [];

        function addLabelIndex(label, index) {
            const L = String(label || '').toUpperCase();
            if (!labelsToIndices.has(L)) labelsToIndices.set(L, []);
            labelsToIndices.get(L).push(index);
        }

        // 罗马数字转换（全局统一）
        function toRoman(num) {
            const romanMap = [
                { val: 1000, str: 'M' }, { val: 900, str: 'CM' },
                { val: 500, str: 'D' }, { val: 400, str: 'CD' },
                { val: 100, str: 'C' }, { val: 90, str: 'XC' },
                { val: 50, str: 'L' }, { val: 40, str: 'XL' },
                { val: 10, str: 'X' }, { val: 9, str: 'IX' },
                { val: 5, str: 'V' }, { val: 4, str: 'IV' },
                { val: 1, str: 'I' }
            ];
            let result = '';
            for (let r of romanMap) {
                while (num >= r.val) { result += r.str; num -= r.val; }
            }
            return result;
        }
        function romanToNum(roman) {
            if (!roman) return NaN;
            const s = roman.toUpperCase().trim();
            const map = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
            let num = 0, prev = 0;
            for (let i = s.length - 1; i >= 0; i--) {
                const val = map[s[i]];
                if (!val) return NaN;
                if (val < prev) num -= val; else num += val;
                prev = val;
            }
            return num;
        }
        function toColumnName(n) {
            let s = '';
            while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
            return s;
        }
        function colNameToNum(col) {
            let s = String(col || '').toUpperCase().trim();
            if (!s) return NaN;
            let n = 0;
            for (let i = 0; i < s.length; i++) {
                const c = s.charCodeAt(i);
                if (c < 65 || c > 90) return NaN;
                n = n * 26 + (c - 64);
            }
            return n;
        }
        function nextColName(col) {
            const n = colNameToNum(col);
            if (isNaN(n)) return null;
            return toColumnName(n + 1);
        }
        let forewordText = '序言加载中...';
        let afterwordText = '后记加载中...';
        let appendix1Text = '附录一加载中...';
        let appendix2Text = '附录二加载中...';
        let pages = [];
        let currentPageIndex = 0;
        const container = document.getElementById('pagesContainer');

        // ============================================================
        // 工具函数
        // ============================================================
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function entryHtml(entry) {
            const word = escapeHtml(entry.word || '');
            const tone = escapeHtml(entry.tone || '');
            const usage = escapeHtml(entry.usage || '');
            const pos = escapeHtml(entry.pos || '');
            const category = escapeHtml(entry.category || '');
            const meaning = escapeHtml(entry.meaning || '');
            const dataId = (entry && typeof entry._id === 'number') ? ` data-entry-id="${entry._id}"` : '';
            let html = `<div class="entry"${dataId}><div class="head"><span class="word">${word}</span><span class="tone">${tone}</span><span class="meta">`;
            if (usage) html += `<span>${usage}</span>`;
            if (pos) html += `<span>${pos}</span>`;
            if (category) html += `<span>${category}</span>`;
            html += `</span></div><div class="meaning">${meaning}</div></div>`;
            return html;
        }

        // 取词条用于排序的首字符：跳过前导的空白、连字符（含常见变体）和点号，返回第一个有效字符（原始字符）
        function leadingCharForSort(word) {
            const w = (word || '').trim();
            if (!w) return ''; // 无有效字符
            // 去掉前导的空白、连字符（含常见变体）和点号
            const s = w.replace(/^[\s\-\u2010-\u2015\u2212·.]+/, '');
            if (!s) return ''; // 全部是分隔符
            return s[0]; // 取第一个字符
        }

        // ============================================================
        // 核心分页函数（一次性完成，极速）
        // ============================================================
        function splitIntoBodyPages(entries) {
            if (!entries || entries.length === 0) {
                return ['<div class="page body-page"><p style="text-align:center;padding:2rem;">暂无词条</p><div class="page-number">1</div></div>'];
            }

            // 1. 计算内容区域尺寸（模拟 .page 的内容区域）
            // 假设 .page 的 padding 为 1.5rem 上下，1rem 左右（与 CSS 一致）
            // 为了精确，我们使用 getComputedStyle 获取实际的 padding 值
            const pageSample = document.createElement('div');
            pageSample.className = 'page';
            pageSample.style.cssText = 'position: absolute; left: -9999px; top: 0; width: 210mm; height: 297mm; padding: 1.5rem 1rem; box-sizing: border-box;';
            document.body.appendChild(pageSample);
            const contentWidth = pageSample.clientWidth;
            const contentHeight = pageSample.clientHeight;
            document.body.removeChild(pageSample);

            // 2. 创建测量容器，尺寸等于内容区域，不带内边距
            const temp = document.createElement('div');
            temp.className = 'body-page';
            temp.style.cssText = `
                position: absolute;
                left: -9999px;
                top: 0;
                width: 210mm;
                height: 500mm;
                overflow: hidden;
                column-count: 2;
                column-gap: 1rem;
                column-fill: auto;
                padding: 0.2rem 0;
                box-sizing: border-box;
                font-size: 1rem;
                line-height: 1.5;
            `;
            document.body.appendChild(temp);

            // 3. 插入所有词条
            const allHtml = entries.map(e => entryHtml(e)).join('');
            temp.innerHTML = allHtml;
            void temp.offsetHeight; // 强制回流

            // 4. 获取词条元素和最大高度
            const items = temp.querySelectorAll('.entry');
            const maxHeight = temp.clientHeight * 1.2;

            // 获取词条下边距
            const sampleEl = items[0];
            const sampleStyle = getComputedStyle(sampleEl);
            const marginBottom = parseFloat(sampleStyle.marginBottom) || 0;

            // 5. 分组
            const groups = [];
            const groupLetters = [];
            let startIndex = 0;
            let currentHeight = 0;

            for (let i = 0; i < items.length; i++) {
                const el = items[i];
                // 注意：offsetHeight 不包含 margin，所以要加上 marginBottom
                const h = el.offsetHeight + marginBottom;

                if (startIndex === i) {
                    currentHeight = h;
                    continue;
                }
                if (currentHeight + h > maxHeight) {
                    groups.push(entries.slice(startIndex, i));
                    // 记录该组首字母（去变音、大写）
                    const first = entries[startIndex];
                    const raw = leadingCharForSort(first.word);
                    let letter = '#';
                    if (raw) {
                        const normalized = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                        const upper = normalized.toUpperCase();
                        const code = upper.charCodeAt(0);
                        if (code >= 65 && code <= 90) {
                            letter = upper;
                        } else if (code < 65) {
                            letter = '-';
                        } else {
                            letter = 'α';
                        }
                    }
                    groupLetters.push(letter);
                    startIndex = i;
                    currentHeight = h;
                } else {
                    currentHeight += h;
                }
            }
            if (startIndex < entries.length) {
                groups.push(entries.slice(startIndex));
                // 记录该组首字母
                const first = entries[startIndex];
                const raw = leadingCharForSort(first.word);
                let letter = '#';
                if (raw) {
                    const normalized = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    const upper = normalized.toUpperCase();
                    const code = upper.charCodeAt(0);
                    if (code >= 65 && code <= 90) {
                        letter = upper;
                    } else if (code < 65) {
                        letter = '-';
                    } else {
                        letter = 'α';
                    }
                }
                groupLetters.push(letter);
            }

            document.body.removeChild(temp);

            // 6. 生成最终页面 HTML
            if (groups.length === 0) {
                return ['<div class="page body-page"><p style="text-align:center;padding:2rem;">暂无词条</p><div class="page-number">1</div></div>'];
            }
            // 辅助函数：从词条获取首字母（去变音、大写）
            function getLetter(entry) {
                const raw = leadingCharForSort(entry.word);
                if (!raw) return '#';
                const normalized = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                const upper = normalized.toUpperCase();
                const code = upper.charCodeAt(0);
                if (code >= 65 && code <= 90) return upper;
                if (code < 65) return '-';
                return 'α';
            }

            const htmls = groups.map((group, idx) => {
                let contentHtml = '';
                let lastLetter = ''; // 上一组的最后一个词条的字母
                if (idx > 0) {
                    const prevGroup = groups[idx - 1];
                    const lastEntry = prevGroup[prevGroup.length - 1];
                    if (lastEntry) {
                        lastLetter = getLetter(lastEntry);
                    }
                }
                // 遍历本组所有词条
                for (let j = 0; j < group.length; j++) {
                    const entry = group[j];
                    const currentLetter = getLetter(entry);
                    // 如果当前字母与上一个不同，且当前字母非空，则插入标题
                    if (currentLetter && currentLetter !== lastLetter) {
                        contentHtml += `<div class="letter-title">${currentLetter}</div>`;
                        lastLetter = currentLetter; // 更新为当前字母，避免重复插入
                    }
                    contentHtml += entryHtml(entry);
                }
                return `<div class="page body-page">${contentHtml}<div class="page-number">${idx + 1}</div></div>`;
            });
            return { htmls, groups, groupLetters };
        }

        // ============================================================
        // 纯文本分页函数（用于序和后记）
        // ============================================================
        // ============================================================
        // 纯文本分页函数（按页面容量自动分页，类似正文）
        // ============================================================
        function splitTextIntoPages(text, baseLabel, pageType) {
            if (!text || text.trim() === '') {
                return [{
                    type: pageType,
                    label: baseLabel,
                    html: `<div class="page ${pageType}"><p style="text-align:center;padding:2rem;">暂无内容</p><div class="page-number">${baseLabel}</div></div>`
                }];
            }

            // 1. 分割为段落（保留段落边界）
            let paragraphs = text.split(/<\/p>\s*<p>/i).map(p => p.trim()).filter(p => p);
            if (paragraphs.length === 0) {
                paragraphs = text.split(/\n+/).map(p => p.trim()).filter(p => p);
            }
            if (paragraphs.length === 0) {
                return [{
                    type: pageType,
                    label: baseLabel,
                    html: `<div class="page ${pageType}"><p style="text-align:center;padding:2rem;">内容为空</p><div class="page-number">${baseLabel}</div></div>`
                }];
            }

            // 2. 获取页面尺寸（固定 210mm × 297mm）
            const pageWidth = 210;
            const pageHeight = 297;
            const mmToPx = 3.7795;
            // 获取实际 padding
            const tempPage = document.createElement('div');
            tempPage.className = 'page';
            tempPage.style.cssText = 'position:absolute;left:-9999px;visibility:hidden;';
            document.body.appendChild(tempPage);
            const compStyle = getComputedStyle(tempPage);
            const pTop = parseFloat(compStyle.paddingTop) || 1.5 * 16;
            const pBottom = parseFloat(compStyle.paddingBottom) || 1.5 * 16;
            const pLeft = parseFloat(compStyle.paddingLeft) || 1 * 16;
            const pRight = parseFloat(compStyle.paddingRight) || 1 * 16;
            document.body.removeChild(tempPage);

            // 使用实际页面容器尺寸，保证测量与显示一致
            const container = document.getElementById('pagesContainer');
            let containerWidth = container ? container.clientWidth : (pageWidth * mmToPx);
            let containerHeight = container ? container.clientHeight : (pageHeight * mmToPx);
            // 减去 padding
            const contentWidth = containerWidth - pLeft - pRight;
            const contentHeight = containerHeight - pTop - pBottom;

            // 3. 创建测量容器
            const pWrapper = document.createElement('div');
            pWrapper.style.cssText = `
                font-size: 1rem;
                line-height: 1.8;
                text-indent: 2em;
                width: ${contentWidth}px;
                padding-bottom: 2px;
                position: absolute;
                left: -9999px;
                top: 0;
                box-sizing: border-box;
            `;
            document.body.appendChild(pWrapper);

            // 4. 逐段添加，直到超出高度，然后截断
            const pageContents = [];
            let currentHtml = '';       // 当前页累积的 HTML
            let currentHeight = 0;


            for (let i = 0; i < paragraphs.length; i++) {
                let limitHeight = contentHeight;
                if (pageContents.length === 0) {
                    limitHeight = contentHeight - 40;   // 第一页减去标题高度
                } else {
                    limitHeight = contentHeight;
                }
                const pText = paragraphs[i];
                // 尝试将本段落完整加入当前页
                const testHtml = currentHtml + `<p style="margin:0;padding:0;">${pText}</p>`;
                pWrapper.innerHTML = testHtml;
                const testHeight = pWrapper.scrollHeight;

                if (currentHeight === 0) {
                    // 第一段总是先加进去
                    currentHtml = testHtml;
                    currentHeight = testHeight;
                    continue;
                }

                if (testHeight <= limitHeight) {
                    // 加入后未超限，保留
                    currentHtml = testHtml;
                    currentHeight = testHeight;
                } else {
                    // 超限了，需要将本段落拆分：前半部分留在当前页，后半部分留到下一页
                    // 分段策略：从段落中逐字符添加，直到刚好不超限
                    // 为了提高效率，采用二分法查找可容纳的最大字符数
                    const fullPara = pText;
                    const paraLength = fullPara.length;
                    // 逐字符填充法：一个一个字符尝试，直到超限
                    let bestLen = 0;
                    for (let idx = 1; idx <= fullPara.length; idx++) {
                        const testHtml = currentHtml + `<p style="margin:0;padding:0;">${fullPara.substring(0, idx)}</p>`;
                        pWrapper.innerHTML = testHtml;
                        const h = pWrapper.scrollHeight;
                        if (h < limitHeight) {
                            bestLen = idx;
                        } else {
                            break;
                        }
                    }
                    // 二分查找结束，得到 bestLen

                    // 当前页最终内容
                    const part1 = fullPara.substring(0, bestLen);
                    let part2 = fullPara.substring(bestLen);
                    // 去除 part2 前导空白（空格、制表符、换行等），避免出现多余缩进
                    part2 = part2.trimStart();
                    part2 = part2.replace(/^[\s\u3000]+/, '');

                    // 保存当前页
                    const finalHtml = currentHtml + `<p style="margin:0;padding:0;">${part1}</p>`;
                    pageContents.push(finalHtml);

                    // 重置当前页为剩余部分
                    // 如果 bestLen === 0，说明整个段落都放到下一页，它是完整段落，不应有 continuation 类
                    const continuationClass = (bestLen === 0) ? '' : ' class="continuation"';
                    currentHtml = `<p style="margin:0;padding:0;"${continuationClass}>${part2}</p>`;
                    currentHeight = pWrapper.scrollHeight;

                    // 如果 part2 为空，则跳过（但理论上不会）
                }
            }

            // 处理最后一页
            if (currentHtml) {
                pageContents.push(currentHtml);
            }

            // 清理
            document.body.removeChild(pWrapper);

            // 生成页面对象
            if (pageContents.length === 1) {
                const content = pageContents[0];
                return [{
                    type: pageType,
                    label: baseLabel,
                    html: `<div class="page ${pageType}">${content}<div class="page-number">${baseLabel}</div></div>`
                }];
            } else {
                return pageContents.map((htmlContent, idx) => {
                    let label;
                    if (idx === 0) {
                        label = baseLabel;
                    } else {
                        // 从 baseLabel 的字符开始递增（如 C → D → E）
                        const baseChar = baseLabel.charCodeAt(0);
                        const nextChar = String.fromCharCode(baseChar + idx);
                        label = nextChar;
                    }
                    return {
                        type: pageType,
                        label: label,
                        html: `<div class="page ${pageType}">${htmlContent}<div class="page-number">${label}</div></div>`
                    };
                });
            }
        }

        function splitAppendixIntoPages(text, startLabel, pageType) {
            if (!text || text.trim() === '') {
                return [{
                    type: pageType,
                    label: startLabel,
                    html: `<div class="page ${pageType}"><p style="text-align:center;padding:2rem;">暂无内容</p><div class="page-number">${startLabel}</div></div>`
                }];
            }

            const linesAll = text.split(/\n/);
            const items = [];
            let currentItem = '';
            const numberChars = '一二三四五六七八九十';
            for (let line of linesAll) {
                // 检查原始行是否以制表符或空格开头（即行首有空白），如果是，则视为续行
                if (line.match(/^[\t ]/)) {
                    // 续行，附加到当前条目（保留原始缩进）
                    if (currentItem) {
                        currentItem += '\n' + line;
                    } else {
                        // 如果没有当前条目，但行首有空白，说明可能是文件开头有空白行，忽略或作为内容
                        // 这里我们仍将其作为内容开始（罕见情况）
                        currentItem = line;
                    }
                } else {
                    // 行首非空白，检查是否以汉字编号开头
                    const trimmed = line.trim();
                    if (trimmed.length > 0 && numberChars.includes(trimmed[0])) {
                        // 新条目
                        if (currentItem) items.push(currentItem.trim());
                        currentItem = line;
                    } else {
                        // 非编号行，作为续行
                        if (currentItem) {
                            currentItem += '\n' + line;
                        } else {
                            currentItem = line;
                        }
                    }
                }
            }
            if (currentItem) items.push(currentItem.trim());
            if (items.length === 0) items.push(text.trim());

            // ---- 获取页面内容高度（与 splitTextIntoPages 一致） ----
            const pageWidth = 210;
            const pageHeight = 297;
            const mmToPx = 3.7795;
            const tempPage = document.createElement('div');
            tempPage.className = 'page';
            tempPage.style.cssText = 'position:absolute;left:-9999px;visibility:hidden;';
            document.body.appendChild(tempPage);
            const compStyle = getComputedStyle(tempPage);
            const pTop = parseFloat(compStyle.paddingTop) || 1.5 * 16;
            const pBottom = parseFloat(compStyle.paddingBottom) || 1.5 * 16;
            const pLeft = parseFloat(compStyle.paddingLeft) || 1 * 16;
            const pRight = parseFloat(compStyle.paddingRight) || 1 * 16;
            document.body.removeChild(tempPage);

            const container = document.getElementById('pagesContainer');
            let containerWidth = container ? container.clientWidth : (pageWidth * mmToPx);
            let containerHeight = container ? container.clientHeight : (pageHeight * mmToPx);
            const contentWidth = containerWidth - pLeft - pRight;
            const contentHeight = containerHeight - pTop - pBottom;
            const SAFETY = 0; // 附录编号内容无外部标题，不减去

            // ---- 罗马数字转换工具 ----
            function toRoman(num) {
                const romanMap = [
                    { val: 1000, str: 'M' }, { val: 900, str: 'CM' },
                    { val: 500, str: 'D' }, { val: 400, str: 'CD' },
                    { val: 100, str: 'C' }, { val: 90, str: 'XC' },
                    { val: 50, str: 'L' }, { val: 40, str: 'XL' },
                    { val: 10, str: 'X' }, { val: 9, str: 'IX' },
                    { val: 5, str: 'V' }, { val: 4, str: 'IV' },
                    { val: 1, str: 'I' }
                ];
                let result = '';
                for (let r of romanMap) {
                    while (num >= r.val) {
                        result += r.str;
                        num -= r.val;
                    }
                }
                return result;
            }

            function romanToNum(roman) {
                const map = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
                let num = 0, prev = 0;
                for (let i = roman.length - 1; i >= 0; i--) {
                    const val = map[roman[i]];
                    if (val < prev) num -= val;
                    else num += val;
                    prev = val;
                }
                return num;
            }

            // ---- 测量工具：一次测量所有行的实际高度 ----
            // 构建测量容器，只包含一个 <p> 用于测量单行，但为了一次性获得所有行高，我们可以将所有行分别放入不同的 <p> 并测量。
            // 更高效：构建一个包含所有行的容器，然后逐个获取每个 <p> 的 offsetHeight。
            const measureWrapper = document.createElement('div');
            measureWrapper.style.cssText = `
                font-size: 1rem;
                line-height: 1.8;
                text-indent: 0;
                width: ${contentWidth}px;
                position: absolute;
                left: -9999px;
                top: 0;
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            `;
            document.body.appendChild(measureWrapper);

            // 全局行列表（每个编号段拆分行）
            const allPages = [];
            let currentStartNum = romanToNum(startLabel);

            // 对每个编号段进行处理
            for (let idxItem = 0; idxItem < items.length; idxItem++) {
                const item = items[idxItem];
                // 将该段按行分割
                const segLines = item.split(/\n/);
                // 测量每行的高度（带样式）
                // 我们一次性插入该段的所有行，并测量高度
                measureWrapper.innerHTML = '';
                for (let line of segLines) {
                    const p = document.createElement('p');
                    p.style.cssText = 'margin:0;padding:0;white-space:pre-wrap;';
                    p.textContent = line;
                    measureWrapper.appendChild(p);
                }
                void measureWrapper.offsetHeight; // 强制回流
                const lineElements = measureWrapper.querySelectorAll('p');
                const lineHeights = [];
                for (let pEl of lineElements) {
                    lineHeights.push(pEl.offsetHeight);
                }

                // 逐行累加，分页
                let pageLines = [];
                let currentHeight = 0;
                const limitHeight = contentHeight - SAFETY; // SAFETY=0，但保留
                for (let i = 0; i < segLines.length; i++) {
                    const h = lineHeights[i];
                    if (currentHeight + h > limitHeight && currentHeight > 0) {
                        // 保存当前页
                        const pageContent = pageLines.join('\n');
                        const label = toRoman(currentStartNum);
                        const html = `<div class="page ${pageType}"><p style="margin:0;padding:0;white-space:pre-wrap;">${pageContent}</p><div class="page-number">${label}</div></div>`;
                        allPages.push({ type: pageType, label: label, html: html });
                        currentStartNum++;
                        // 重置
                        pageLines = [];
                        currentHeight = 0;
                        // 当前行需要放入新页
                        pageLines.push(segLines[i]);
                        currentHeight += h;
                    } else {
                        pageLines.push(segLines[i]);
                        currentHeight += h;
                    }
                }
                // 处理剩余的页
                if (pageLines.length > 0) {
                    const pageContent = pageLines.join('\n');
                    const label = toRoman(currentStartNum);
                    const html = `<div class="page ${pageType}"><p style="margin:0;padding:0;white-space:pre-wrap;">${pageContent}</p><div class="page-number">${label}</div></div>`;
                    allPages.push({ type: pageType, label: label, html: html });
                    currentStartNum++;
                }

                // 清理测量容器（准备下一个编号段）
                measureWrapper.innerHTML = '';
            }

            document.body.removeChild(measureWrapper);
            return allPages;
        }

        // ============================================================
        // 生成目录 HTML
        // ============================================================
        function generateTocHtml(letterStartPage, bodyPageCount, forewordIndex, afterwordIndex, imageIndex, imageLabel, appendix1Index, appendix1Label, appendix2Index, appendix2Label) {
            const letters = Object.keys(letterStartPage).sort((a, b) => {
                if (a === '-') return -1;
                if (b === '-') return 1;
                if (a === 'α') return 1;
                if (b === 'α') return -1;
                return a.localeCompare(b);
            });

            const letterItems = letters.map(letter => {
                const page = letterStartPage[letter];
                const displayLetter = letter === '#' ? '其他' : letter;
                return `<a class=".toc-grid a" onclick="jumpToLetter('${letter}', event)">${displayLetter} <span class="toc-page">${page}</span></a>`;
            }).join('');

            let html = `
                <a class="toc-heading" onclick="goToPage(${forewordIndex})">序 <span class="toc-page">C</span></a>
            `;
            if (imageIndex !== undefined && imageLabel) {
                html += `
                <a class="toc-heading" onclick="goToPage(${imageIndex})">图片 <span class="toc-page">${imageLabel}</span></a>
                `;
            }
            html += `
                <div class="toc-heading">正文</div>
                ${letterItems}
            `;

            // 先添加后记
            html += `
                <a class="toc-heading" onclick="goToPage(${afterwordIndex})">后记 <span class="toc-page">I</span></a>
            `;

            // 再添加附录
            if (appendix1Index !== undefined || appendix2Index !== undefined) {
                html += `<div class="toc-heading">附录</div>`;
                if (appendix1Index !== undefined && appendix1Label) {
                    html += `<a class=".toc-grid a" style="column-span: all;" onclick="goToPage(${appendix1Index})">附录一 <span class="toc-page">${appendix1Label}</span></a>`;
                }
                if (appendix2Index !== undefined && appendix2Label) {
                    html += `<a class=".toc-grid a" style="column-span: all;" onclick="goToPage(${appendix2Index})">附录二 <span class="toc-page">${appendix2Label}</span></a>`;
                }
            }

            return html;
        }

        // ============================================================
        // 跳转到字母
        // ============================================================
        function jumpToLetter(letter, e) {
            if (e) e.stopPropagation();
            const idx = allEntries.findIndex(e => {
                const raw = leadingCharForSort(e.word);
                if (!raw) return false;
                const normalized = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                const upper = normalized.toUpperCase();
                const code = upper.charCodeAt(0);
                let key;
                if (code >= 65 && code <= 90) {
                    key = upper;
                } else if (code < 65) {
                    key = '-';
                } else {
                    key = 'α';
                }
                return key === letter;
            });

            // 计算该词条所在的正文页索引（pages 数组中的索引）
            let cumulative = 0;
            let targetPage = -1;
            for (let i = 0; i < pages.length; i++) {
                const p = pages[i];
                if (p.type === 'body') {
                    // 统计当前页的词条数
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = p.html;
                    const count = tempDiv.querySelectorAll('.entry').length;
                    if (cumulative + count > idx) {
                        targetPage = i;
                        break;
                    }
                    cumulative += count;
                }
            }
            if (targetPage !== -1) {
                goToPage(targetPage);
            }
        }

        // ============================================================
        // 构建所有页面
        // ============================================================
        function buildPages() {
            entryIdToPageIndex.clear();
            labelsToIndices.clear();
            firstBodyPageIndex = -1;

            pages = [];

            // ---- 封面 ----
            pages.push({
                type: 'cover',
                label: 'cover',
                html: `<div class="page cover" id="page-cover"> <h1>萬漢辭典</h1> <div class="subtitle">WANLON-ZOGIA-LESA FORHIGOUR</div> <img class="badge" src="badge.png" alt="Badge"> <div class="author">王篤生 編</div> <div class="meta">修訂版 · 18700+個詞條</div> </div>`
            });
            const coverIndex = pages.length - 1;
            addLabelIndex('cover', coverIndex);
            // ---- 扉页（含简短题词，页码 A） ----
            pages.push({
                type: 'flyleaf',
                label: 'A',
                html: `<div class="page" id="page-flyleaf" style="padding-top:8rem;padding-left:2rem;font-family:'Georgia','Times New Roman',serif;font-style:italic;color:#3d3228;">
                    <br><br><br><br><br><br><br><br><br><br>
                    <p style="font-size:3rem;margin:0;line-height:1.6;-webkit-text-stroke: 0.4px #d4af37;">Reu athyden</p>
                    <p style="font-size:3rem;margin:0;line-height:1.6;padding-left:2rem;-webkit-text-stroke: 0.4px #d4af37;">qu'ie polozuch otanecuisna</p>
                    <p style="font-size:3rem;margin:0;line-height:1.6;padding-left:2rem;-webkit-text-stroke: 0.4px #d4af37;">la nouval de Barbel Tawn</p>
                    <p style="font-size:3rem;margin:0;line-height:1.6;padding-left:4rem;-webkit-text-stroke: 0.4px #d4af37;">vu athy do hjumanithyn</p>
                    <div class="page-number" style="font-style:normal;font-family:inherit;">A</div>
                </div>`
            });
            const flyIndex = pages.length - 1;
            addLabelIndex('A', flyIndex);

            // ---- 序（可能多页） ----
            const forewordPages = splitTextIntoPages(forewordText, 'C', 'foreword');
            forewordPages.forEach((p, idx) => {
                if (idx === 0) {
                    p.html = p.html.replace('<div class="page foreword">', '<div class="page foreword"><h2>序</h2>');
                }
                pages.push(p);
                const pageIndex = pages.length - 1;
                addLabelIndex(p.label, pageIndex);
            });

            // ---- 图片页（插入在序和正文之间） ----
            // 图片文件列表（请自行填写实际路径）
            const imageFiles = ['image/image1.png', 'image/image2.png', 'image/image3.png', 'image/image4.png', 'image/image5.png', 'image/image6.png', 'image/image7.png', 'image/image8.png', 'image/image9.png', 'image/image10.png', 'image/image11.png', 'image/image12.png', 'image/image13.png', 'image/image14.png', 'image/image15.png', 'image/image16.png', 'image/image17.png', 'image/image18.png', 'image/image19.png', 'image/image20.png', 'image/image21.png', 'image/image22.png', 'image/image23.png', 'image/image24.png', 'image/image25.png', 'image/image26.png', 'image/image27.png', 'image/image28.png', 'image/image29.png', 'image/image30.png', 'image/image31.png', 'image/image32.png', 'image/image33.png'];
            if (imageFiles.length > 0) {
                // 辅助函数：数字转列名（1->A, 27->AA）
                function toColumnName(n) {
                    let s = '';
                    while (n > 0) {
                        n--;
                        s = String.fromCharCode(65 + (n % 26)) + s;
                        n = Math.floor(n / 26);
                    }
                    return s;
                }

                // 获取序的最后一页的页码字母
                let startLetter = 'F';
                if (forewordPages.length > 0) {
                    const lastForeword = forewordPages[forewordPages.length - 1];
                    const lastLetter = lastForeword.label;
                    startLetter = String.fromCharCode(lastLetter.charCodeAt(0) + 1);
                }
                let startNum = startLetter.charCodeAt(0) - 64; // A=1
                for (let i = 0; i < imageFiles.length; i++) {
                    const num = startNum + i;
                    const label = toColumnName(num);
                    const imgHtml = `<div class="page image-page"><img src="${imageFiles[i]}" style="width:100%;height:100%;object-fit:contain;"><div class="page-number">${label}</div></div>`;
                    pages.push({ type: 'image', label: label, html: imgHtml });
                    const idx = pages.length - 1;
                    addLabelIndex(label, idx);
                }
            }

            // ---- 正文分页 ----
            const { htmls: bodyHtmls, groups, groupLetters } = splitIntoBodyPages(allEntries);
            const bodyPageCount = bodyHtmls.length;
            // firstBodyPageIndex = pages.length;
            bodyHtmls.forEach((html, idx) => {
                const letter = groupLetters[idx] || '';
                const letterHtml = letter ? `<div class="letter-header">${letter}</div>` : '';
                const htmlWithHeader = html.replace('<div class="page body-page">', `<div class="page body-page">${letterHtml}`);
                const pageObj = { type: 'body', label: String(idx + 1), html: htmlWithHeader };
                pages.push(pageObj);
                const pageIndex = pages.length - 1;
                addLabelIndex(pageObj.label, pageIndex);
                // 为当前页的所有词条建立 entry -> page 映射
                const group = groups[idx];
                if (group) {
                    for (const ent of group) {
                        if (typeof ent._id === 'number') {
                            entryIdToPageIndex.set(ent._id, pageIndex);
                        }
                    }
                }
            });

            // ---- 后记（可能多页） ----
            const afterwordStartLabel = String(bodyPageCount + 1);
            // 后记页码用罗马数字（I, II, III, IV, V...）
            function toRoman(num) {
                const romanMap = [
                    { val: 1000, str: 'M' }, { val: 900, str: 'CM' },
                    { val: 500, str: 'D' }, { val: 400, str: 'CD' },
                    { val: 100, str: 'C' }, { val: 90, str: 'XC' },
                    { val: 50, str: 'L' }, { val: 40, str: 'XL' },
                    { val: 10, str: 'X' }, { val: 9, str: 'IX' },
                    { val: 5, str: 'V' }, { val: 4, str: 'IV' },
                    { val: 1, str: 'I' }
                ];
                let result = '';
                for (let r of romanMap) {
                    while (num >= r.val) {
                        result += r.str;
                        num -= r.val;
                    }
                }
                return result;
            }

            const afterwordPages = splitTextIntoPages(afterwordText, afterwordStartLabel, 'afterword');
            afterwordPages.forEach((p, idx) => {
                if (idx === 0) {
                    p.html = p.html.replace('<div class="page afterword">', '<div class="page afterword"><h2>后记</h2>');
                }
                // 将页码改为罗马数字（从 I 开始）
                const romanLabel = toRoman(idx + 1);
                p.label = romanLabel;
                p.html = p.html.replace(
                    /<div class="page-number">.*?<\/div>/,
                    `<div class="page-number">${romanLabel}</div>`
                );
                pages.push(p);
                const pageIndex = pages.length - 1;
                addLabelIndex(p.label, pageIndex);
            });

            // ---- 附录一（接后记页码之后，使用罗马数字） ----
            // 获取后记最后一页的罗马数字
            let lastAfterwordLabel = 'I';
            for (let i = pages.length - 1; i >= 0; i--) {
                if (pages[i].type === 'afterword') {
                    lastAfterwordLabel = pages[i].label;
                    break;
                }
            }
            // 罗马数字转数字
            function romanToNum(roman) {
                const map = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
                let num = 0, prev = 0;
                for (let i = roman.length - 1; i >= 0; i--) {
                    const val = map[roman[i]];
                    if (val < prev) num -= val;
                    else num += val;
                    prev = val;
                }
                return num;
            }
            const lastNum = romanToNum(lastAfterwordLabel);
            const appendix1StartNum = lastNum + 1;
            const appendix1Label = toRoman(appendix1StartNum);

            // 分页附录一
            const appendix1Pages = splitAppendixIntoPages(appendix1Text, appendix1Label, 'appendix');
            appendix1Pages.forEach((p, idx) => {
                if (idx === 0) {
                    // 自定义标题：三行（保留空格，换行用 <br>）
                    const titleHtml = `<h2>附录一<br>Amorin de la Temza Corona Birus<br>Amor del Tiempo Corona Virus<br>新冠时期的爱情</h2>`;
                    // 在第一个 <p> 标签前插入标题
                    p.html = p.html.replace('<p style="margin:0;padding:0;white-space:pre-wrap;">', titleHtml + '<p style="margin:0;padding:0;white-space:pre-wrap;">');
                }
                pages.push(p);
                const pageIndex = pages.length - 1;
                addLabelIndex(p.label, pageIndex);
            });

            // ---- 附录二（接附录一页码之后） ----
            // 获取附录一最后一页的罗马数字
            let lastAppendix1Label = appendix1Label;
            for (let i = pages.length - 1; i >= 0; i--) {
                if (pages[i].type === 'appendix') {
                    lastAppendix1Label = pages[i].label;
                    break;
                }
            }
            const appendix1LastNum = romanToNum(lastAppendix1Label);
            const appendix2StartNum = appendix1LastNum + 1;
            const appendix2Label = toRoman(appendix2StartNum);

            const appendix2Pages = splitAppendixIntoPages(appendix2Text, appendix2Label, 'appendix');
            appendix2Pages.forEach((p, idx) => {
                if (idx === 0) {
                    // 自定义标题：附录二 + 两个空格 + 重要语法杂记
                    const titleHtml = `<h2>附录二  重要语法杂记</h2>`;
                    p.html = p.html.replace('<p style="margin:0;padding:0;white-space:pre-wrap;">', titleHtml + '<p style="margin:0;padding:0;white-space:pre-wrap;">');
                }
                pages.push(p);
                const pageIndex = pages.length - 1;
                addLabelIndex(p.label, pageIndex);
            });

            // ---- 计算每个首字母的起始页码 ----
            const letterStartPage = {};
            groups.forEach((group, idx) => {
                const pageNum = idx + 1;
                group.forEach(entry => {
                    const w = entry.word || '';
                    const raw = leadingCharForSort(w);
                    let key = '#';
                    if (raw) {
                        const normalized = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                        const upper = normalized.toUpperCase();
                        const code = upper.charCodeAt(0);
                        if (code >= 65 && code <= 90) {
                            key = upper;
                        } else if (code < 65) {
                            key = '-';
                        } else {
                            key = 'α';
                        }
                    }
                    if (!(key in letterStartPage)) {
                        letterStartPage[key] = pageNum;
                    }
                });
            });

            // 获取序和后记的第一页索引（用于目录跳转）
            const forewordIndex = pages.findIndex(p => p.type === 'foreword');
            const afterwordIndex = pages.findIndex(p => p.type === 'afterword');
            // 获取图片页的第一页索引和标签（用于目录跳转）
            let imageIndex = undefined;
            let imageLabel = '';
            for (let i = 0; i < pages.length; i++) {
                if (pages[i].type === 'image') {
                    imageIndex = i + 1; // 因为目录会插入在索引1，所以后面的页索引+1
                    imageLabel = pages[i].label;
                    break;
                }
            }

            // ---- 获取附录一和附录二的索引（用于目录跳转） ----
            const appendix1Index = pages.findIndex(p => p.type === 'appendix' && p.html.includes('附录一'));
            const appendix2Index = pages.findIndex(p => p.type === 'appendix' && p.html.includes('附录二'));

            // 因为目录页即将插入到索引1，所有后续页的索引都会 +1
            const tocHtml = generateTocHtml(
                letterStartPage,
                bodyPageCount,
                forewordIndex + 1,
                afterwordIndex + 1,
                imageIndex,
                imageLabel,
                appendix1Index !== -1 ? appendix1Index + 1 : undefined,
                appendix1Label,
                appendix2Index !== -1 ? appendix2Index + 1 : undefined,
                appendix2Label
            );

            // ---- 创建目录页并插入到索引2（封面0，扉页1） ----
            const tocPage = {
                type: 'toc',
                label: 'B',
                html: `<div class="page toc" id="page-toc"><h2>目录</h2><div class="toc-grid">${tocHtml}</div><div class="page-number">B</div></div>`
            };
            const insertAt = 2;              // 目录固定在索引2
            pages.splice(insertAt, 0, tocPage);

            // ========== 重建所有索引映射（推荐方案B） ==========
            labelsToIndices.clear();
            for (let i = 0; i < pages.length; i++) {
                addLabelIndex(pages[i].label, i);
            }

            entryIdToPageIndex.clear();
            for (let i = 0; i < pages.length; i++) {
                if (pages[i].type === 'body') {
                    // 从页面 HTML 中读取所有 entry 的 data-entry-id
                    const tmp = document.createElement('div');
                    tmp.innerHTML = pages[i].html;
                    tmp.querySelectorAll('.entry[data-entry-id]').forEach(node => {
                        const id = parseInt(node.getAttribute('data-entry-id'), 10);
                        if (!isNaN(id)) entryIdToPageIndex.set(id, i);
                    });
                }
            }

            // 用最终 pages 定位正文首页索引
            firstBodyPageIndex = pages.findIndex(p => p.type === 'body');
            // ========== 重建结束 ==========
        }

        // ============================================================
        // 渲染和导航
        // ============================================================
        function renderAllPages() {
            container.innerHTML = '';
            const fragment = document.createDocumentFragment();
            pages.forEach((p, idx) => {
                const div = document.createElement('div');
                div.innerHTML = p.html;
                const pageEl = div.firstElementChild;
                pageEl.dataset.index = idx;
                if (idx !== 0) pageEl.classList.remove('active');
                pageEl.style.display = (idx === 0) ? '' : 'none';
                fragment.appendChild(pageEl);
            });
            container.appendChild(fragment);
            // 激活第一页
            const first = container.children[0];
            if (first) {
                first.classList.add('active');
                first.style.display = '';
            }
            currentPageIndex = 0;
        }

        function goToPage(index) {
            if (index < 0 || index >= pages.length) return;
            container.querySelectorAll('.page').forEach(el => {
                el.classList.remove('active');
                el.style.display = 'none';
            });
            const target = container.children[index];
            if (target) {
                target.classList.add('active');
                target.style.display = '';
            }
            currentPageIndex = index;
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        document.getElementById('book').addEventListener('click', function (e) {
            // 如果点击的是“回目录”的标题，不处理翻页
            if (e.target.closest('.letter-title, .letter-header, .foreword h2, .afterword h2, .appendix h2')) {
                return;
            }
            if (e.target.closest('a')) return;
            const active = container.querySelector('.page.active');
            if (!active) return;
            const rect = active.getBoundingClientRect();
            const isLeft = (e.clientX - rect.left) < rect.width / 2;
            let target = currentPageIndex;
            if (isLeft) target = Math.max(0, currentPageIndex - 1);
            else target = Math.min(pages.length - 1, currentPageIndex + 1);
            if (target !== currentPageIndex) goToPage(target);
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') { const t = Math.max(0, currentPageIndex - 1); if (t !== currentPageIndex) goToPage(t); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { const t = Math.min(pages.length - 1, currentPageIndex + 1); if (t !== currentPageIndex) goToPage(t); e.preventDefault(); }
        });

        // ============================================================
        // 主加载
        // ============================================================
        async function loadData() {
            console.log('loadData 开始');
            const metaEl = document.querySelector('#page-cover .meta');
            if (metaEl) metaEl.innerHTML = '加载中...';

            try {
                const resp = await fetch(DATA_URL);
                // 加载序和后记（外部文件）
                try {
                    const fResp = await fetch('序.txt');
                    if (fResp.ok) forewordText = await fResp.text();

        // 窗口缩放调节：使内容随窗口宽度等比缩放，分页不变
        function adjustScale() {
            const bookEl = document.getElementById('book');
            if (!bookEl) return;

            // 先清空 transform，测量“自然尺寸”（基准尺寸）
            const prevTransform = bookEl.style.transform;
            bookEl.style.transform = 'none';

            const baseW = bookEl.offsetWidth;   // 包含 padding、书脊等
            const baseH = bookEl.offsetHeight;

            // 视口可用大小（body 已无 padding）
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            // 给书留一点安全边距，避免贴边（可按需修改或设为 0）
            const SAFE_MARGIN = 16; // px
            const availW = Math.max(0, vw - SAFE_MARGIN * 2);
            const availH = Math.max(0, vh - SAFE_MARGIN * 2);

            // 按宽高都能容纳的比例缩放（PDF 式）
            let scale = 1;
            if (baseW > 0 && baseH > 0) {
                scale = Math.min(availW / baseW, availH / baseH);
            }

            // 不限制下限，上下尽量适配；如需限制可启用下一行：
            // scale = Math.max(0.2, Math.min(scale, 3));

            bookEl.style.transformOrigin = 'center center';
            bookEl.style.transform = `scale(${scale})`;
        }

        function jumpByLabelOrNumber(raw) {
            const s = raw.trim();
            if (/^\d+$/.test(s)) {
                const label = String(parseInt(s, 10));
                const idxs = labelsToIndices.get(label);
                if (idxs && idxs.length) { goToPage(idxs[0]); return; }
                alert('未找到正文页 ' + label);
                return;
            }
            if (/^[A-Za-z]+$/.test(s)) {
                const L = s.toUpperCase();
                const idxs = labelsToIndices.get(L) || [];
                if (L === 'I') {
                    const front = idxs.filter(i => i < firstBodyPageIndex);
                    const back = idxs.filter(i => i >= firstBodyPageIndex && (pages[i].type === 'afterword' || pages[i].type === 'appendix'));
                    if (front.length === 0 && back.length === 0 && idxs.length) {
                        goToPage(idxs[0]); return;
                    }
                    _IModalFront = front;
                    _IModalBack = back;
                    document.getElementById('modalMask').style.display = 'block';
                    return;
                } else {
                    if (idxs.length) { goToPage(idxs[0]); return; }
                    const rn = romanToNum(L);
                    if (!isNaN(rn)) {
                        const romanLabel = toRoman(rn);
                        const rIdxs = labelsToIndices.get(romanLabel);
                        if (rIdxs && rIdxs.length) { goToPage(rIdxs[0]); return; }
                    }
                    alert('未找到标签 ' + L);
                    return;
                }
            }
            const rn = romanToNum(s);
            if (!isNaN(rn)) {
                const label = toRoman(rn);
                const idxs = labelsToIndices.get(label);
                if (idxs && idxs.length) { goToPage(idxs[0]); return; }
                alert('未找到罗马页 ' + label);
                return;
            }
            alert('不支持的页码格式：' + s);
        }

        function doSearch(q, listEl) {
            listEl.innerHTML = '';
            if (!q) return;
            const qs = q.toLowerCase();
            const results = [];
            for (let i = 0; i < allEntries.length; i++) {
                const e = allEntries[i];
                const w = (e.word || '').toString();
                const m = (e.meaning || '').toString();
                if (w.toLowerCase().includes(qs) || m.toLowerCase().includes(qs)) {
                    results.push({ id: e._id, word: w, meaning: m });
                    if (results.length >= 100) break;
                }
            }
            if (results.length === 0) {
                listEl.innerHTML = '<div class="item">无结果</div>';
                return;
            }
            const frag = document.createDocumentFragment();
            for (const r of results) {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span class="w">${escapeHtml(r.word)}</span><span class="m">${escapeHtml(r.meaning).slice(0, 120)}</span>`;
                div.addEventListener('click', () => {
                    const pidx = entryIdToPageIndex.get(r.id);
                    if (typeof pidx === 'number') {
                        highlightEntryOnPage(r.id, pidx);
                    } else {
                        alert('未能定位该词条所在页');
                    }
                });
                frag.appendChild(div);
            }
            listEl.appendChild(frag);
        }

        function parseCustomSpecToIndices(spec) {
            if (!spec) return [];
            const tokens = spec.split(/[,\uFF0C]+/).map(s => s.trim()).filter(Boolean);
            const out = [];
            for (const t of tokens) {
                const m = t.match(/^([A-Za-z]+|\d+|[IVXLCDM]+)\s*-\s*([A-Za-z]+|\d+|[IVXLCDM]+)$/i);
                if (m) {
                    const a = m[1], b = m[2];
                    if (/^\d+$/.test(a) && /^\d+$/.test(b)) {
                        let x = parseInt(a, 10), y = parseInt(b, 10);
                        if (x > y) [x, y] = [y, x];
                        for (let n = x; n <= y; n++) addByLabel(String(n), out);
                    } else if (/^[IVXLCDM]+$/i.test(a) && /^[IVXLCDM]+$/i.test(b)) {
                        // 罗马数字范围：只添加后置页（后记/附录）
                        let x = romanToNum(a), y = romanToNum(b);
                        if (isNaN(x) || isNaN(y)) throw new Error('罗马数字不合法：' + a + '-' + b);
                        if (x > y) [x, y] = [y, x];
                        for (let n = x; n <= y; n++) addByLabelRoman(toRoman(n), out);
                    } else if (/^[A-Za-z]+$/.test(a) && /^[A-Za-z]+$/.test(b)) {
                        // 字母范围：只添加前置页（封面/序言/图片等）
                        const A = a.toUpperCase(), B = b.toUpperCase();
                        let cur = A;
                        const limit = 2000;
                        let count = 0;
                        while (true) {
                            addByLabelFront(cur, out);
                            if (cur === B) break;
                            cur = nextColName(cur);
                            if (!cur) break;
                            if (++count > limit) break;
                        }
                    } else {
                        throw new Error('范围不匹配：' + t);
                    }
                } else {
                    const s = t;
                    if (/^\d+$/.test(s)) addByLabel(String(parseInt(s, 10)), out);
                    else if (/^[IVXLCDM]+$/i.test(s)) addByLabelRoman(toRoman(romanToNum(s)), out);
                    else if (/^[A-Za-z]+$/.test(s)) addByLabelFront(s.toUpperCase(), out);
                    else throw new Error('无法解析：' + s);
                }
            }
            return out;

            // 原逻辑：无差别添加（保留用于纯数字页码）
            function addByLabel(label, arr) {
                const idxs = labelsToIndices.get(String(label).toUpperCase());
                if (idxs && idxs.length) arr.push(...idxs);
            }

            // 新增：只添加前置页（索引 < firstBodyPageIndex），用于字母范围（如 A-I）
            function addByLabelFront(label, arr) {
                const idxs = labelsToIndices.get(String(label).toUpperCase());
                if (idxs && idxs.length) {
                    for (const idx of idxs) {
                        if (idx < firstBodyPageIndex) {
                            arr.push(idx);
                        }
                    }
                }
            }

            // 新增：只添加后置页（索引 >= firstBodyPageIndex），用于罗马数字范围（如 I-IV）
            function addByLabelRoman(label, arr) {
                const idxs = labelsToIndices.get(String(label).toUpperCase());
                if (idxs && idxs.length) {
                    for (const idx of idxs) {
                        if (idx >= firstBodyPageIndex) {
                            arr.push(idx);
                        }
                    }
                }
            }
        }

        function preloadImagesIn(root) {
            const imgs = Array.from(root.querySelectorAll('img'));
            if (imgs.length === 0) return Promise.resolve();
            return Promise.all(imgs.map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(res => {
                    img.onload = res;
                    img.onerror = res;  // 出错也不卡
                });
            }));
        }

        // 压缩图片，长边限制到 2000px，JPEG 质量 0.7
        async function downscaleImagesIn(root, maxSide = 2000, quality = 0.7) {
            const imgs = Array.from(root.querySelectorAll('img'));
            if (imgs.length === 0) return;
            for (const img of imgs) {
                const nw = img.naturalWidth || 0, nh = img.naturalHeight || 0;
                if (!nw || !nh) continue;
                const side = Math.max(nw, nh);
                if (side <= maxSide) continue; // 已经足够小
                const scale = maxSide / side;
                const tw = Math.round(nw * scale);
                const th = Math.round(nh * scale);
                const canvas = document.createElement('canvas');
                canvas.width = tw;
                canvas.height = th;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, tw, th);
                try {
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    img.src = dataUrl;
                } catch (e) {
                    console.warn('图片压缩失败', e);
                }
            }
        }

        async function renderPageToImage(index, scale = 1) {
            try {
                const offscreen = document.getElementById('offscreenWrapper') || (() => {
                    const d = document.createElement('div');
                    d.id = 'offscreenWrapper';
                    d.style.cssText = 'position:fixed;left:-100000px;top:0;opacity:0;pointer-events:none;z-index:-1;';
                    document.body.appendChild(d);
                    return d;
                })();

                const src = container.children[index];
                if (!src) {
                    console.warn(`页面 ${index} 不存在`);
                    return null;
                }

                const pageWidth = container.offsetWidth || 800;
                const pageHeight = container.offsetHeight || 1123;

                const clone = src.cloneNode(true);

                // 关键修复 2：严格复用 style.css 中的类，确保内部样式（如 column-count, width: 100%）正确计算
                clone.classList.add('active');       // 触发 .page.active { display: block; }
                clone.style.display = 'block';       // 双重保险，覆盖继承的 display: none
                clone.style.position = 'relative';   // 避免 absolute 在 offscreen 中失去参照物
                clone.style.width = pageWidth + 'px';
                clone.style.height = pageHeight + 'px';
                clone.style.transform = 'none';      // 清除可能的缩放干扰

                offscreen.appendChild(clone);

                const canvas = await html2canvas(clone, {
                    // 关键修复 3：与 style.css 中 .page 的 background 保持完全一致
                    backgroundColor: '#fcf9f2',
                    scale: scale,
                    useCORS: true,
                    logging: false,
                    allowTaint: false,
                    width: pageWidth,
                    height: pageHeight,
                });

                const url = canvas.toDataURL('image/png');
                offscreen.removeChild(clone);
                return url;
            } catch (err) {
                console.error(`渲染第 ${index} 页失败:`, err);
                const offscreen = document.getElementById('offscreenWrapper');
                if (offscreen && offscreen.lastChild) {
                    offscreen.removeChild(offscreen.lastChild);
                }
                return null;
            }
        }


        async function exportPdfSingleFile(indices, { batchSize = 120, scale = 2, watermarkText = '', concurrency = 6, onProgress = null } = {}) {
            await ensureLibs();
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageW = pdf.internal.pageSize.getWidth();
            const pageH = pdf.internal.pageSize.getHeight();

            let added = 0;
            const total = indices.length;
            const totalBatches = Math.ceil(total / batchSize);

            for (let start = 0; start < total; start += batchSize) {
                const currentBatch = Math.floor(start / batchSize) + 1;
                const part = indices.slice(start, start + batchSize);

                for (let blockStart = 0; blockStart < part.length; blockStart += concurrency) {
                    const block = part.slice(blockStart, blockStart + concurrency);
                    const renderPromises = block.map(idx => renderPageToImage(idx, scale));
                    const results = await Promise.allSettled(renderPromises);
                    const imgDataList = results.map(r => r.status === 'fulfilled' ? r.value : null);

                    for (let i = 0; i < block.length; i++) {
                        const imgData = imgDataList[i];
                        if (!imgData) {
                            console.warn(`页面 ${block[i]} 渲染失败，已跳过`);
                            continue;
                        }
                        if (added > 0) pdf.addPage('a4', 'p');

                        // 先铺整页底色 #fcf9f2
                        pdf.setFillColor(252, 249, 242);
                        pdf.rect(0, 0, pageW, pageH, 'F');

                        // 再把截图按“内边距”放进去
                        const margin = 10; // 单位：mm
                        pdf.addImage(imgData, 'PNG', margin, margin, pageW - margin * 2, pageH - margin * 2, undefined, 'FAST');
                        if (watermarkText) {
                            pdf.setFontSize(24);
                            pdf.setTextColor(150, 150, 150);
                            pdf.setGState(new pdf.GState({ opacity: 0.2 }));
                            pdf.text(watermarkText, pageW / 2, pageH / 2, { align: 'center', angle: 45 });
                            pdf.setGState(new pdf.GState({ opacity: 1 }));
                        }
                        added++;

                        // 触发进度回调
                        if (onProgress) {
                            onProgress(added, total);
                        }

                        if (added % 5 === 0) {
                            await new Promise(r => setTimeout(r, 0));
                        }
                    }
                }
                await new Promise(r => setTimeout(r, 50));
            }

            if (onProgress) onProgress(total, total); // 确保最终达到 100%

            // ================= 核心下载代码 =================
            console.log('PDF 内存生成完毕，准备触发浏览器下载...');

            // 1. 生成带时间戳的唯一文件名，防止被覆盖或找不到
            const now = new Date();
            const timeStamp = now.getFullYear() +
                String(now.getMonth() + 1).padStart(2, '0') +
                String(now.getDate()).padStart(2, '0') + '-' +
                String(now.getHours()).padStart(2, '0') +
                String(now.getMinutes()).padStart(2, '0');
            const fileName = `Wanlon-Dictionary-${timeStamp}.pdf`;

            // 2. 将 jsPDF 对象转换为 Blob (二进制大对象)
            const pdfBlob = pdf.output('blob');

            // 3. 创建一个临时的本地 URL 指向这个 Blob
            const blobUrl = URL.createObjectURL(pdfBlob);

            // 4. 动态创建一个隐藏的 <a> 标签来触发下载 (这是前端最底层、最可靠的下载方式)
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = fileName;
            a.style.display = 'none';
            document.body.appendChild(a);

            // 5. 模拟点击，触发浏览器的下载行为
            a.click();

            // 6. 善后工作：移除标签并释放内存
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);

            console.log(`下载指令已发送给浏览器！文件名: ${fileName}`);
            console.log('提示：如果没看到文件，请立即按 Ctrl+J (Mac: Cmd+Option+L) 查看浏览器的下载记录！');
        }

        async function ensureLibs() {
            if (window.jspdf && window.html2canvas) return;
            const tasks = [];
            if (!window.html2canvas) {
                tasks.push(new Promise((res, rej) => {
                    const s = document.createElement('script');
                    s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                    s.onload = res;
                    s.onerror = rej;
                    document.head.appendChild(s);
                }));
            }
            if (!window.jspdf) {
                tasks.push(new Promise((res, rej) => {
                    const s = document.createElement('script');
                    s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
                    s.onload = () => {
                        window.jsPDF = window.jspdf.jsPDF;
                        res();
                    };
                    s.onerror = rej;
                    document.head.appendChild(s);
                }));
            }
            await Promise.all(tasks);
        }

        function initSidebar() {

            const btnClose = document.getElementById('btnCloseSidebar');

            const searchResults = document.getElementById('searchResults');
            const dlStatus = document.getElementById('dlStatus');
            const modalMask = document.getElementById('modalMask');
            const btnIFront = document.getElementById('btnIFront');
            const btnIBack = document.getElementById('btnIBack');
            const btnModalCancel = document.getElementById('btnModalCancel');
            const customSpecBox = document.getElementById('customSpecBox');
            const customSpec = document.getElementById('customSpec');

            btnOpen.addEventListener('click', () => sidebar.classList.add('open'));
            btnClose.addEventListener('click', () => sidebar.classList.remove('open'));

            document.querySelectorAll('input[name="dlScope"]').forEach(r => {
                r.addEventListener('change', () => {
                    if (r.value === 'custom' && r.checked) customSpecBox.classList.add('visible');
                    else if (r.checked) customSpecBox.classList.remove('visible');
                });
            });

            btnJump.addEventListener('click', () => {
                const raw = (jumpInput.value || '').trim();
                if (!raw) return;
                jumpByLabelOrNumber(raw);
            });
            jumpInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') btnJump.click();
            });

            let searchTimer = null;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => doSearch(searchInput.value.trim(), searchResults), 150);
            });

            btnModalCancel.addEventListener('click', () => modalMask.style.display = 'none');
            btnIFront.addEventListener('click', () => {
                modalMask.style.display = 'none';
                jumpToDisambiguatedI(true);
            });
            btnIBack.addEventListener('click', () => {
                modalMask.style.display = 'none';
                jumpToDisambiguatedI(false);
            });

            btnPrintExport.addEventListener('click', async () => {
                const btn = document.getElementById('btnPrintExport');
                const progressContainer = document.getElementById('progressContainer');
                const pdfProgress = document.getElementById('pdfProgress');
                const dlStatus = document.getElementById('dlStatus');

                btn.disabled = true;
                btn.textContent = '生成中...';

                // 显示进度条并重置状态
                progressContainer.style.display = 'block';
                pdfProgress.value = 0;
                dlStatus.textContent = '准备导出...';

                try {
                    const scope = document.querySelector('input[name="dlScope"]:checked')?.value || 'all';
                    let indices = [];
                    if (scope === 'all') {
                        indices = Array.from({ length: pages.length }, (_, i) => i);
                    } else if (scope === 'body') {
                        indices = [];
                        for (let i = 0; i < pages.length; i++) {
                            if (pages[i].type === 'body') indices.push(i);
                        }
                    } else {
                        const spec = (document.getElementById('customSpec').value || '').trim();
                        try {
                            indices = parseCustomSpecToIndices(spec);
                        } catch (err) {
                            dlStatus.textContent = '自定义页解析失败：' + err.message;
                            btn.disabled = false;
                            btn.textContent = '下载为PDF';
                            return;
                        }
                        if (!indices.length) {
                            dlStatus.textContent = '未选择任何页';
                            btn.disabled = false;
                            btn.textContent = '下载为PDF';
                            return;
                        }
                    }
                    indices = Array.from(new Set(indices)).sort((a, b) => a - b);

                    // 执行导出，并传入进度回调
                    await exportPdfSingleFile(indices, {
                        batchSize: 120,
                        scale: 2,
                        watermarkText: 'om per Wanlonrin DuDuCat',
                        concurrency: 6,
                        onProgress: (current, total) => {
                            const percent = Math.round((current / total) * 100);
                            pdfProgress.value = percent;
                            dlStatus.textContent = `正在生成: ${current} / ${total} 页 (${percent}%)`;
                        }
                    });

                    dlStatus.textContent = '导出完成！正在保存...';
                } catch (err) {
                    console.error(err);
                    dlStatus.textContent = '导出失败：' + err.message;
                } finally {
                    btn.disabled = false;
                    btn.textContent = '下载为PDF';
                    // 3秒后自动隐藏进度条容器
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                    }, 3000);
                }
            });

        }
    </script>
    <div id="wmPrintOverlay" aria-hidden="true"></div>
</body>

</html>
