<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Wanlon-Lesa Word Cloud Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Gothic A1", sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 50%, #333 50%, #111 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 0 15px 30px 15px;
        }

        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 999;
            padding: 12px 20px;
            max-width: 1200px;
            margin: 0 auto 20px auto;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-weight: bold;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            filter: blur(0.8px);
            object-fit: cover;
        }

        ul {
            list-style: none;
            display: flex;
            gap: 16px;
        }

        a {
            color: #000;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .hero {
            max-width: 1000px;
            margin: 0 auto 25px auto;
            padding: 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #333;
        }

        .search-section {
            max-width: 600px;
            margin: 0 auto 25px auto;
            padding: 15px 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            font-family: inherit;
        }

        .search-box input:focus {
            outline: none;
            background: white;
        }

        .search-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
            transition: 0.2s;
        }

        .search-box button:hover {
            background: black;
            transform: scale(1.02);
        }

        .search-hint {
            font-size: 13px;
            color: #555;
            text-align: center;
        }

        .network-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 10px;
        }

        #mynetwork {
            width: 100%;
            height: 600px;
            border-radius: 16px;
            background: rgba(245, 245, 245, 0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 6px 18px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #444;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: black;
        }

        .mode-badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>

    <header class="glass">
        <nav>
            <div class="logo">
                Wanlon-lesa
                <img src="Wanlon-logo.png" alt="logo" onerror="this.style.display='none'">
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="Files.html">Files</a></li>
                <li><a href="AIagent.html">AI Agent</a></li>
                <li><a href="wanlon_network.html">Word Cloud</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero glass">
        <h1>Wanlon Word Cloud</h1>
        <p>Click the category nodes to search for words and relative words</p>
    </div>

    <div class="search-section glass">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Input wanlon-lesa words, like: abacus, americia, samboya"
                autocomplete="off">
            <button id="searchBtn"><i class="fas fa-search"></i>Search</button>
        </div>
        <div class="search-hint">
            <i class="fas fa-lightbulb"></i>After searching the word, words in same category will be displayed.
        </div>
    </div>

    <div class="network-container glass">
        <div id="backBtnContainer">Back</div>
        <div id="mynetwork"></div>
    </div>

    <div class="stats" id="stats">
        <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading...</div>
    </div>

    <script>
        let network = null;
        let nodesDataSet = null;
        let edgesDataSet = null;
        let fullData = null;          // 存储完整数据
        let currentNodeType = 'category';  // 'category' 或 'word'
        let currentCategory = null;   // 当前展开的分类
        let currentSearchWord = null;  // 当前搜索的单词
        let nodeInfoMap = {};          // 存储节点详细信息

        // 颜色池（用于分类节点）
        const colorPool = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#F39C12', '#9B59B6', '#3498DB', '#E74C3C', '#1ABC9C', '#E67E22'];

        // 加载 JSON 数据
        async function loadData() {
            try {
                const response = await fetch('wanlon_data.json');
                if (!response.ok) throw new Error('Loading data error');
                const data = await response.json();
                return data;
            } catch (error) {
                document.getElementById('stats').innerHTML = '<span style="color:red;">❌ Cannot load the wanlon_data.json, Please make sure that the file is saved in </span>';
                return null;
            }
        }

        // 获取分类的颜色
        function getCategoryColor(categoryName, index) {
            let hash = 0;
            for (let i = 0; i < categoryName.length; i++) {
                hash = ((hash << 5) - hash) + categoryName.charCodeAt(i);
                hash = hash & hash;
            }
            return colorPool[Math.abs(hash) % colorPool.length];
        }

        // 绘制分类视图（初始视图）
        function drawCategoryView(data) {
            const nodes = [];
            const edges = [];
            nodeInfoMap = {};

            const categories = data.category_nodes;

            categories.forEach((cat, idx) => {
                const color = getCategoryColor(cat.category_name, idx);
                nodes.push({
                    id: cat.id,
                    label: cat.label,
                    type: 'category',
                    category_name: cat.category_name,
                    word_count: cat.word_count,
                    color: { background: color, border: color },
                    shape: 'box',
                    size: 25,
                    font: { size: 14, color: '#000' },
                    title: `${cat.category_name}\ncontains ${cat.word_count} words\nClick to expand`
                });
                nodeInfoMap[cat.id] = {
                    type: 'category',
                    category_name: cat.category_name,
                    word_count: cat.word_count
                };
            });

            // 分类节点之间无边（初始视图无连接）
            nodesDataSet = new vis.DataSet(nodes);
            edgesDataSet = new vis.DataSet(edges);

            const container = document.getElementById('mynetwork');
            const options = {
                nodes: { shape: 'box', size: 25, font: { size: 14, face: 'Gothic A1' } },
                edges: { width: 1, color: { color: '#aaa' }, smooth: false },
                physics: { enabled: false },  // 关闭物理引擎，瞬间加载
                interaction: { hover: true, tooltipDelay: 200, navigationButtons: true }
            };

            if (network) network.destroy();
            network = new vis.Network(container, { nodes: nodesDataSet, edges: edgesDataSet }, options);

            document.getElementById('stats').innerHTML = `
            <div class="stat-card"><i class="fas fa-folder"></i> Category nodes: ${nodes.length}</div>
            <div class="stat-card"><i class="fas fa-info-circle"></i> Category view: Press to expand</div>
        `;
            document.getElementById('backBtnContainer').innerHTML = '';
            currentNodeType = 'category';
            currentCategory = null;
            currentSearchWord = null;

            attachInteractions(data);
        }

        // 展开某个分类下的所有单词
        function expandCategory(data, categoryName) {
            const words = data.category_words[categoryName];
            if (!words || words.length === 0) return;

            const wordInfo = data.word_info;
            const nodes = [];
            const edges = [];
            nodeInfoMap = {};

            // 添加单词节点
            words.forEach((word, idx) => {
                const info = wordInfo[word];
                const categoryColor = getCategoryColor(categoryName, 0);
                nodes.push({
                    id: word,
                    label: word,
                    type: 'word',
                    category: categoryName,
                    definition: info?.definition || '',
                    pos: info?.pos || '',
                    tone: info?.tone || '',
                    color: { background: '#E8F4FD', border: categoryColor },
                    shape: 'dot',
                    size: 18,
                    font: { size: 12 },
                    title: `<b>${word}</b><br>Explanation: ${info?.definition || 'None'}<br>Part of Speech: ${info?.pos || 'None'}<br>Catogory: ${categoryName}`
                });
                nodeInfoMap[word] = {
                    type: 'word',
                    category: categoryName,
                    definition: info?.definition || '',
                    pos: info?.pos || '',
                    tone: info?.tone || ''
                };
            });

            // 同一分类下单词两两相连（每个单词最多连5个）
            const edgeSet = new Set();
            for (let i = 0; i < words.length; i++) {
                for (let j = i + 1; j < Math.min(i + 6, words.length); j++) {
                    const key = `${words[i]}|${words[j]}`;
                    if (!edgeSet.has(key)) {
                        edgeSet.add(key);
                        edges.push({ from: words[i], to: words[j], width: 1 });
                    }
                }
            }

            nodesDataSet = new vis.DataSet(nodes);
            edgesDataSet = new vis.DataSet(edges);

            const container = document.getElementById('mynetwork');
            const options = {
                nodes: { shape: 'dot', size: 18, font: { size: 12 } },
                edges: { width: 1, color: { color: '#aaa' }, smooth: { type: 'continuous' } },
                physics: { enabled: true, stabilization: { iterations: 30 }, forceAtlas2Based: { gravitationalConstant: -30 } },
                interaction: { hover: true, tooltipDelay: 200, navigationButtons: true }
            };

            if (network) network.destroy();
            network = new vis.Network(container, { nodes: nodesDataSet, edges: edgesDataSet }, options);

            document.getElementById('stats').innerHTML = `
            <div class="stat-card"><i class="fas fa-book"></i> Word: ${nodes.length}</div>
            <div class="stat-card"><i class="fas fa-code-branch"></i> Edge: ${edges.length}</div>
            <div class="stat-card"><i class="fas fa-folder-open"></i> Category: ${categoryName}</div>
        `;
            document.getElementById('backBtnContainer').innerHTML = '<a class="back-btn" id="backToCategoryBtn"><i class="fas fa-arrow-left"></i>Back to the category view</a>';
            document.getElementById('backToCategoryBtn').onclick = () => drawCategoryView(data);

            currentNodeType = 'word';
            currentCategory = categoryName;
            currentSearchWord = null;

            attachInteractions(data);

            // 稳定布局后居中
            setTimeout(() => { network.fit(); }, 500);
        }

        // 搜索单词
        function searchWord(data, word) {
            const wordInfo = data.word_info;
            if (!wordInfo[word]) {
                alert(`Cannot find the word: "${word}"`);
                return false;
            }

            const category = wordInfo[word].category;
            const allWordsInCategory = data.category_words[category] || [];

            let displayWords = allWordsInCategory;

            const nodes = [];
            const edges = [];
            nodeInfoMap = {};

            displayWords.forEach(w => {
                const info = wordInfo[w];
                nodes.push({
                    id: w,
                    label: w,
                    type: 'word',
                    category: category,
                    definition: info?.definition || '',
                    pos: info?.pos || '',
                    tone: info?.tone || '',
                    color: { background: w === word ? '#FFF3CD' : '#E8F4FD', border: getCategoryColor(category, 0) },
                    shape: 'dot',
                    size: w === word ? 22 : 16,
                    font: { size: w === word ? 14 : 11 },
                    title: `<b>${w}</b><br>Explanation: ${info?.definition || 'None'}<br>Part of Speech: ${info?.pos || 'None'}<br>Catogory: ${category}`
                });
                nodeInfoMap[w] = {
                    type: 'word',
                    category: category,
                    definition: info?.definition || '',
                    pos: info?.pos || '',
                    tone: info?.tone || ''
                };
            });

            // 生成边（同分类下相连）
            const edgeSet = new Set();
            for (let i = 0; i < displayWords.length; i++) {
                for (let j = i + 1; j < Math.min(i + 6, displayWords.length); j++) {
                    const key = `${displayWords[i]}|${displayWords[j]}`;
                    if (!edgeSet.has(key)) {
                        edgeSet.add(key);
                        edges.push({ from: displayWords[i], to: displayWords[j], width: 1 });
                    }
                }
            }

            nodesDataSet = new vis.DataSet(nodes);
            edgesDataSet = new vis.DataSet(edges);

            const container = document.getElementById('mynetwork');
            const options = {
                nodes: { shape: 'dot', size: 16, font: { size: 11 } },
                edges: { width: 1, color: { color: '#aaa' }, smooth: { type: 'continuous' } },
                physics: { enabled: true, stabilization: { iterations: 30 }, forceAtlas2Based: { gravitationalConstant: -30 } },
                interaction: { hover: true, tooltipDelay: 200, navigationButtons: true }
            };

            if (network) network.destroy();
            network = new vis.Network(container, { nodes: nodesDataSet, edges: edgesDataSet }, options);

            document.getElementById('stats').innerHTML = `
            <div class="stat-card"><i class="fas fa-search"></i> Search: ${word}</div>
            <div class="stat-card"><i class="fas fa-book"></i> Display: ${displayWords.length} words</div>
            <div class="stat-card"><i class="fas fa-folder"></i> Category: ${category}</div>
        `;
            document.getElementById('backBtnContainer').innerHTML = '<a class="back-btn" id="backToCategoryBtn"><i class="fas fa-arrow-left"></i>Back to the category view</a>';
            document.getElementById('backToCategoryBtn').onclick = () => drawCategoryView(fullData);

            currentNodeType = 'word';
            currentCategory = category;
            currentSearchWord = word;

            attachInteractions(data);

            setTimeout(() => { network.fit(); }, 500);
            return true;
        }

        // 交互逻辑（单击高亮，双击卡片）
        function attachInteractions(data) {
            if (!network) return;

            network.off("click");
            network.off("doubleClick");

            // 单击事件
            network.on("click", function (params) {
                if (params.nodes.length === 0) {
                    // 点击空白：恢复所有节点颜色（仅单词视图需要）
                    if (nodesDataSet && currentNodeType === 'word') {
                        const allNodes = nodesDataSet.get();
                        const updates = allNodes.map(n => {
                            if (n.type === 'word') {
                                const isSearchHighlight = (currentSearchWord && n.id === currentSearchWord);
                                return {
                                    id: n.id,
                                    color: { background: isSearchHighlight ? '#FFF3CD' : '#E8F4FD', border: n.color?.border || '#4ECDC4' },
                                    borderWidth: 1
                                };
                            }
                            return { id: n.id, color: null, borderWidth: 1 };
                        });
                        nodesDataSet.update(updates);
                    }
                    return;
                }

                const nodeId = params.nodes[0];
                const nodeInfo = nodeInfoMap[nodeId];

                if (currentNodeType === 'category' && nodeInfo?.type === 'category') {
                    // 分类视图：点击分类节点展开
                    expandCategory(data, nodeInfo.category_name);
                } else if (currentNodeType === 'word') {
                    // 单词视图：高亮同分类单词
                    const targetCategory = nodeInfo?.category;
                    if (targetCategory && nodesDataSet) {
                        const allNodes = nodesDataSet.get();
                        const updates = allNodes.map(n => {
                            if (n.type === 'word' && nodeInfoMap[n.id]?.category === targetCategory) {
                                return { id: n.id, color: { background: '#FFE0B2', border: '#FF9800' }, borderWidth: 2 };
                            } else {
                                const isSearchHighlight = (currentSearchWord && n.id === currentSearchWord);
                                return {
                                    id: n.id,
                                    color: { background: isSearchHighlight ? '#FFF3CD' : '#E8F4FD', border: n.color?.border || '#4ECDC4' },
                                    borderWidth: 1
                                };
                            }
                        });
                        nodesDataSet.update(updates);
                    }
                }
            });

            // 双击显示单词卡片
            let modal = null;
            function createModal() {
                const div = document.createElement('div');
                div.id = 'word-card-modal';
                div.style.cssText = `
                position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                background: rgba(30,30,40,0.95); backdrop-filter: blur(16px);
                border-radius: 20px; padding: 24px; min-width: 280px; max-width: 400px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 10000;
                border: 1px solid rgba(255,255,255,0.3); color: white; display: none;
            `;
                div.innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                    <h3 id="card-word" style="margin:0;"></h3>
                    <span id="close-modal" style="cursor:pointer; font-size:28px;">&times;</span>
                </div>
                <hr><p><strong>释义：</strong> <span id="card-def"></span></p>
                <p><strong>词性：</strong> <span id="card-pos"></span></p>
                <p><strong>分类：</strong> <span id="card-cat"></span></p>
                <p><strong>声调：</strong> <span id="card-tone"></span></p>
            `;
                document.body.appendChild(div);
                document.getElementById('close-modal').onclick = () => div.style.display = 'none';
                return div;
            }

            network.on("doubleClick", function (params) {
                if (params.nodes.length === 0) return;
                const nodeId = params.nodes[0];
                const info = nodeInfoMap[nodeId];
                if (!info) return;

                if (info.type === 'category') {
                    // 分类节点双击：显示分类统计
                    alert(`Category: ${info.category_name}\nnumber of words contained: ${info.word_count}`);
                } else {
                    if (!modal) modal = createModal();
                    document.getElementById('card-word').innerHTML = `<i class="fas fa-language"></i> ${nodeId}`;
                    document.getElementById('card-def').innerHTML = info.definition || 'None';
                    document.getElementById('card-pos').innerHTML = info.pos || 'None';
                    document.getElementById('card-cat').innerHTML = info.category || 'None';
                    document.getElementById('card-tone').innerHTML = info.tone || 'None';
                    modal.style.display = 'block';
                }
            });
        }

        // 初始化
        async function init() {
            fullData = await loadData();
            if (fullData) {
                drawCategoryView(fullData);

                // 绑定搜索事件
                const searchBtn = document.getElementById('searchBtn');
                const searchInput = document.getElementById('searchInput');
                searchBtn.onclick = () => {
                    const word = searchInput.value.trim();
                    if (word) searchWord(fullData, word);
                };
                searchInput.onkeypress = (e) => {
                    if (e.key === 'Enter') searchBtn.click();
                };
            }
        }

        init();
    </script>
</body>

</html>
