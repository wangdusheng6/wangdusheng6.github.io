<p class="desc">复朝建立后，恢复万宗正统。万宗非宗教，而是类似儒教的哲学及礼教体系。复朝以万宗为国本，承华夏之正朔。后因子孙不肖，四恶渐生，权臣专权，诸侯不朝，昊天祭祀废弛，国势日衰，为恒朝所灭。</p>
