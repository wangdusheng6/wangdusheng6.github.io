<p class="desc">出身贫寒，曾为叫花子。随军参军，节节高升，首领把女儿嫁给他，首领死后成为首领。因出身低微，为攀附衡朝正统，改姓刘。灭后恒后改名刘窬。建立复朝后，晚年改回吴姓，名吴窬。</p>
