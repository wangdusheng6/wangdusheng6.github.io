<div class="dynasty-body">
<p class="desc">南阳山区组建红巾军，反西秦，自称光复华夏正统。信奉摩尼教，抛弃了自古以来万宗的传统。青州、关中、太行山各处义军纷纷响应。宋内乱后，红巾军一部占江东国号陈，一部占江淮国号梁。最终红巾军首领吴乞儿（后改名刘窬）灭后恒，屠戮明教（除非皈依），恢复万宗正统，建立复朝。</p>
