<p class="desc">新朝攻破洛阳，迁都洛阳，从此后三国形成。疆域包括河北、河南、洛阳、后齐之地、燕云十六州、辽东、整个大草原，南到大名府（邯郸）、大同南界附近。极盛时期，后魏内附，后凉名义附新。</p>
