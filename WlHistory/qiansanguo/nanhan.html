<p class="desc">越（粤）即泰也，南汉即南泰。君主荒淫无道，宗室内乱自噬。君主淫乱后宫被母亲杀掉，其母郛夫人夺权称帝；老太太生活更加淫乱，被长女金屏公主杀死；金屏公主与兄弟通奸，被哥哥在通奸时勒死；哥哥称帝仍荒淫无道。宗室近亲相奸，血脉无以为继，最终被旁支所屠尽。国力大衰，被宋乘机吞并。</p>
