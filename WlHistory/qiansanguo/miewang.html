<span class="years">949-1046</span>
<span>共计十余国</span>
</div>

<div class="dynasty-body">
<p class="desc">前三国时代群雄并立，除上述主要政权外，以下政权先后灭亡：</p>
<div class="table-wrap">
<table>
<thead>
<tr><th>政权</th><th>灭亡方式</th></tr>
</thead>
<tbody>
<tr><td>（西）恒</td><td>被汉所灭</td></tr>
<tr><td>（西）赵</td><td>汉权臣篡汉建立，后并入汉赵</td></tr>
<tr><td>前魏</td><td>南下破蜀后被汉偷袭吞并</td></tr>
<tr><td>齐</td><td>被汉赵灭</td></tr>
<tr><td>东明</td><td>淄州纳土归降汉赵</td></tr>
<tr><td>楚/唐（后楚）</td><td>被泰国攻破武昌</td></tr>
<tr><td>昌</td><td>被南诏攻破，后魏南下破蜀时涉及</td></tr>
<tr><td>闽越</td><td>先被泰国攻，后闽国纳土归宋</td></tr>
<tr><td>吴越</td><td>被宋灭</td></tr>
<tr><td>泰/后泰</td><td>被南齐（宋前身）东进所灭</td></tr>
<tr><td>南齐</td><td>被宋篡</td></tr>
<tr><td>燕</td><td>被新吞并</td></tr>
<tr><td>辽</td><td>并入燕，随燕亡</td></tr>
</tbody>
</table>
