<p class="desc">（西）恒被汉所灭后，西恒宗室王氏在凤翔复辟，建立（东）恒。攻长安不成，向西转夺岐、金城、秦州，活动于关西甘南。后被汉赵攻破凤翔，东恒未灭亡，退至关西甘南，名义上附汉赵（实际自治，不称帝称王）。后汉赵灭亡，东恒归汉。最终被吐蕃灭亡。</p>
