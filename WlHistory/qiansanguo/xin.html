<p class="desc">原为八武镇中的头曼镇，吞并其他七镇后自称新朝（喀喇朵颜）。推翻宁朝，君主姓子（宁朝君主旁支），后草原化改姓阿史那。压住赵代两地，后吞并燕，尽得辽东。后推行南北面官制，汉化改革。</p>
